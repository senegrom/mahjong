[package]
name = "libriichi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# Built and audited as a separate workspace for the `libriichi` Python module.
# Keep its Python bindings on the patched dependency family used by riichi-py.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "riichi"
crate-type = ["cdylib", "rlib"]

# The bins are tools for mjai logs on disk; they need the Python-only half of
# the crate and its native-only dependencies.
[[bin]]
name = "stat"
path = "src/bin/stat.rs"
required-features = ["pymod"]

[[bin]]
name = "validate_logs"
path = "src/bin/validate_logs.rs"
required-features = ["pymod"]

# Everything the observation encoder needs, and nothing else: this set has to
# build for wasm32-unknown-unknown so the browser can encode the same planes.
[dependencies]
anyhow = "1"
log = "0.4"
serde_json = "1"
boomphf = "0.6"
byteorder = "1"
ndarray = "0.17"
serde_with = "3"
flate2 = "1"
derivative = "2"
# default features would pull in `runtime-rng` -> getrandom, which has no
# backend on wasm32-unknown-unknown. `no-rng` only unlocks `Default` for
# `RandomState`; without a rng feature ahash seeds itself from constants, which
# is just as fast and does not change any lookup. `pymod` turns `runtime-rng`
# back on (it wins over `no-rng`), so the Python build hashes as it does today.
ahash = { version = "0.8", default-features = false, features = ["std", "no-rng"] }
tinyvec = { version = "1", features = ["alloc", "serde", "rustc_1_57"] }
serde = { version = "1", features = ["derive"] }

# Python- and native-only: self-play, dataset building, statistics, agents.
pyo3-log = { version = "0.13.4", optional = true }
rayon = { version = "1", optional = true }
numpy = { version = "0.29", optional = true }
rand = { version = "0.10", optional = true }
rand_chacha = { version = "0.10", optional = true }
sha3 = { version = "0.12", optional = true }
glob = { version = "0.3", optional = true }
parking_lot = { version = "0.12", optional = true }
crossbeam = { version = "0.8", optional = true }
pyo3 = { version = "0.29.2", features = ["auto-initialize", "multiple-pymethods", "anyhow"], optional = true }
indicatif = { version = "0.18", features = ["rayon"], optional = true }
derive_more = { version = "2", features = ["add", "add_assign", "sum"], optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.29.2", optional = true }

[features]
default = ["pymod", "mimalloc"]
mimalloc = ["dep:mimalloc"]
# The full crate as the `libriichi` Python extension module. Without it the
# crate is a plain Rust library holding the state machine, the mahjong
# algorithms and the observation encoder -- the half that builds for wasm.
pymod = [
    "dep:pyo3",
    "dep:pyo3-log",
    "dep:pyo3-build-config",
    "dep:numpy",
    "dep:rayon",
    "dep:rand",
    "dep:rand_chacha",
    "dep:sha3",
    "dep:glob",
    "dep:parking_lot",
    "dep:crossbeam",
    "dep:indicatif",
    "dep:derive_more",
    "pyo3/extension-module",
    "ahash/runtime-rng",
]
abi3 = ["pyo3?/abi3"]
sp_reproduce_cpp_ver = []
