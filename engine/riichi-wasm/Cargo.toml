[package]
name = "riichi-wasm"
description = "WebAssembly bindings for the riichi rules engine"
version.workspace = true
edition.workspace = true
# Written out rather than inherited from the workspace: some versions of
# wasm-pack refuse to parse an inherited license and fail the deploy with
# "invalid type: map, expected a string", which turned up once as a flaky
# build. The value is the workspace's.
license = "AGPL-3.0-or-later"
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
riichi-core = { path = "../riichi-core" }
# Mortal's engine, for its observation alone: the networks trained since
# September read its 1012 planes, and the page cannot play one it cannot
# encode for. Without default features the crate is a plain Rust library,
# no Python, and it builds for wasm. It is its own workspace, so this is a
# path dependency across two of them, which cargo allows.
libriichi = { path = "../libriichi", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
