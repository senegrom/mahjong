[workspace]
resolver = "2"
members = [
    "engine/riichi-core",
    "engine/riichi-cli",
    "engine/riichi-wasm",
    "engine/riichi-py",
]
# Mortal's engine, vendored: its own workspace, built as its own Python
# module. See engine/libriichi/NOTICE.md.
exclude = ["engine/libriichi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/senegrom/mahjong"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
