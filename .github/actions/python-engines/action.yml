name: Python engines
description: >-
  Install the pinned CPU export and training tools, then build and install the
  real Python engines: the training engine (riichi_py) and the observation
  engine (libriichi). Set up Python and the Rust toolchain first.
runs:
  using: composite
  steps:
    - name: Install CPU training and export dependencies
      shell: bash
      run: |
        pins="$GITHUB_ACTION_PATH/constraints.txt"
        export_pins="$GITHUB_ACTION_PATH/export-constraints.txt"
        python "$GITHUB_ACTION_PATH/check_pins.py" snapshot "$RUNNER_TEMP/python-before.json"
        # Every pinned release, from PyPI: PyTorch's own dependencies are
        # among them, so that Dependabot reviews those too.
        python -m pip install -r "$pins" -r "$export_pins"
        # The PyTorch release the Modal image installs (neural/modal_app.py),
        # without its dependencies: PyTorch's index would otherwise supply
        # whatever releases of them it carries.
        python -m pip install --no-deps torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
        # A dependency of PyTorch that the pins lack fails here, and so does
        # a package that arrived unpinned.
        python -m pip check
        python "$GITHUB_ACTION_PATH/check_pins.py" check "$RUNNER_TEMP/python-before.json" \
          "$pins" "$export_pins" --allow torch
    - name: Build the training engine
      shell: bash
      working-directory: engine/riichi-py
      run: maturin build --release --locked --out ../../wheels
    - name: Build the observation engine
      shell: bash
      working-directory: engine/libriichi
      run: maturin build --release --locked --out ../../wheels
    - name: Install the real Python engines
      shell: bash
      run: python -m pip install wheels/*.whl
