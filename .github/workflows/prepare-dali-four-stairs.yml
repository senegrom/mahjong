name: Prepare approved Dali staircase

on:
  push:
    branches: [art/dali-four-disks-stairs-20261006]
    paths: [.github/workflows/prepare-dali-four-stairs.yml, .art-staging/**]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/art/dali-four-disks-stairs-20261006'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: art/dali-four-disks-stairs-20261006
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Integrate selected artwork and verify all previous art is unchanged
        run: node .art-staging/prepare.mjs
      - name: Commit verified clean tree on preparation branch only
        run: |
          test "$GITHUB_REF" = refs/heads/art/dali-four-disks-stairs-20261006
          test ! -e .art-staging
          test ! -e .github/workflows/prepare-dali-four-stairs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare selected full-resolution Dali four-disks staircase with preservation tests'
          git push origin HEAD:refs/heads/art/dali-four-disks-stairs-20261006
