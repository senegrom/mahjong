name: Prepare approved Potter's Table

on:
  push:
    branches: [design/van-gogh-nine-disks-potters-table-20261003]
    paths:
      - '.potters-table-transfer/**'
      - '.github/workflows/prepare-potters-table.yml'

permissions:
  contents: write

concurrency:
  group: prepare-potters-table-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/design/van-gogh-nine-disks-potters-table-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Import selected C and verify preserved artwork
        run: python3 .potters-table-transfer/prepare.py
      - name: Lint changed JavaScript
        working-directory: web
        run: ./node_modules/.bin/eslint scripts/export-van-gogh-tiles.mjs tests/tile-faces.test.js tests/van-gogh-nine-disks.test.js --max-warnings 0
      - name: Tile, source preservation and offline regression tests
        working-directory: web
        run: node --test tests/tile-faces.test.js tests/van-gogh-*.test.js tests/offline.test.js
      - name: Commit verified replacement and remove temporary transport
        run: |
          rm -rf .potters-table-transfer
          rm .github/workflows/prepare-potters-table.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-nine-disks.test.js .potters-table-transfer .github/workflows/prepare-potters-table.yml
          git diff --cached --check
          git commit -m 'feat(tiles): replace Van Gogh 9 disks with The Potter’s Table C'
          git push origin "HEAD:${GITHUB_REF_NAME}"
