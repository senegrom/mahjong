name: apply verified inference review
on:
  push:
    branches: [fix/inference-parity-bounds-20260916]
    paths: [.github/workflows/apply-inference-review.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/inference-parity-bounds-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/inference-parity-bounds-20260916
          persist-credentials: true
      - name: Verify reviewed patch digest and destination paths
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, pathlib
          encoded = ''.join(pathlib.Path(f'.inference-patch-{i}.b64').read_text().strip() for i in range(7))
          patch = bz2.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '86f0dd14d0181128481a93a0948fcf33e05cd977d70e904da67b355bf2ef0377', 'Patch digest mismatch'
          paths = []
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  _, _, a, b = line.split()
                  assert a.startswith('a/') and b.startswith('b/') and a[2:] == b[2:]
                  p = pathlib.PurePosixPath(a[2:])
                  assert '..' not in p.parts and (p.parts[0] in ('docs', 'neural') or str(p) in ('web/scripts/inference-contract-check.mjs', 'web/tests/policy-worker.test.js', '.github/workflows/neural.yml'))
                  paths.append(str(p))
          assert len(paths) == len(set(paths)) == 20, 'Unexpected file set'
          pathlib.Path('/tmp/inference-review.patch').write_bytes(patch)
          # CI has contents permission, not workflow permission. The workflow
          # change is deliberately excluded and handled by the authorized connector.
          source_paths = [p for p in paths if p != '.github/workflows/neural.yml']
          assert len(source_paths) == 19
          pathlib.Path('/tmp/inference-paths.txt').write_text('\n'.join(source_paths) + '\n')
          PY
      - name: Refuse concurrent edits to reviewed source
        run: |
          git fetch --no-tags --depth=1 origin 20d287234d15f0b61969a5cab883629dbfa1b947
          git diff --exit-code 20d287234d15f0b61969a5cab883629dbfa1b947 HEAD -- docs neural web
          git apply --check --exclude=.github/workflows/neural.yml /tmp/inference-review.patch
      - name: Apply source and remove transport files
        run: |
          git apply --exclude=.github/workflows/neural.yml /tmp/inference-review.patch
          python3 -m compileall -q neural
          git diff --check
          git add --pathspec-from-file=/tmp/inference-paths.txt
          git rm .inference-patch-*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify ordinary and search inference, bound rollouts and test browser fusion'
          git push origin HEAD:refs/heads/fix/inference-parity-bounds-20260916
