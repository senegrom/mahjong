name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  engine:
    name: rules engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all takes in path dependencies too, so this also checks the vendored
      # engine/libriichi (riichi-wasm depends on it), follow.rs included.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Python binding smoke test
        run: |
          cargo build --locked -p riichi-py
          python3 engine/riichi-py/smoke-test.py
      - name: Audit Rust dependencies
        run: |
          if ! command -v cargo-audit >/dev/null || [ "$(cargo-audit --version)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          cargo audit
      - name: Fuzz the rules
        env:
          FUZZ_SEED: ${{ github.run_number }}
        run: |
          cargo build --locked --release -p riichi-cli
          ./target/release/riichi-cli fuzz --games 500 --seed "$FUZZ_SEED"
      - name: Arena sanity check
        run: ./target/release/riichi-cli arena --games 20 --seed 1

  # The npm audit on its own: an advisory or a registry outage fails this job
  # alone, and every test still reports. Publishing needs it all the same.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    # On 22 October the registry held each failing audit for up to 7 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # The audit reads the lockfile, so nothing is installed. The script fails
      # on any advisory rated low or above but those it excuses.
      - name: Audit npm dependencies
        working-directory: web
        run: node scripts/npm-audit.mjs

  # The rest of npm run verify, in three shards side by side. Each builds the
  # WebAssembly and the site and runs its share of the browser suite, which
  # web/scripts/browser-suite.mjs balances on the seconds each script took.
  # The third also runs lint, svelte-check and the unit and icon checks, and
  # on main packages the site for Pages.
  web:
    name: web app ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # The longest shard, the whole-game review's replay cases alone (each loads
    # the published network in a page of its own), comes to about 13 minutes,
    # and to 26 when they fail once and run a second time; the rest is room for
    # a cold Rust cache and a slow runner.
    timeout-minutes: 45
    strategy:
      # A failing shard must not cancel the others before they report.
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: 3
            checks: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null || [ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit
      - name: Build WebAssembly
        working-directory: web
        run: npm run wasm
      - name: Build the site
        id: site
        working-directory: web
        run: npm run build
      # Each quick check runs once the site is built, whatever the others said,
      # so that one failure does not hide the rest. The Pages steps below run
      # only when every step before them passed.
      - name: Lint
        if: ${{ !cancelled() && matrix.checks && steps.site.outcome == 'success' }}
        working-directory: web
        run: npm run lint
      - name: Svelte diagnostics
        if: ${{ !cancelled() && matrix.checks && steps.site.outcome == 'success' }}
        working-directory: web
        run: npm run check
      # Only the memory regression, a unit test, reads it.
      - name: Prepare verified network for the memory regression
        if: ${{ !cancelled() && matrix.checks && steps.site.outcome == 'success' }}
        working-directory: web
        run: node scripts/prepare-test-network.mjs "$RUNNER_TEMP/mahjong-memory-model.onnx"
      - name: Unit tests
        if: ${{ !cancelled() && matrix.checks && steps.site.outcome == 'success' }}
        working-directory: web
        env:
          MAHJONG_NETWORK: ${{ runner.temp }}/mahjong-memory-model.onnx
        run: npm run test:unit
      - name: Icons
        if: ${{ !cancelled() && matrix.checks && steps.site.outcome == 'success' }}
        working-directory: web
        run: npm run check:icons
      # Runs once the site is built, whatever the quick checks above said.
      - name: Browser checks
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        working-directory: web
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:browser
      - name: Upload UI regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-regression-evidence-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
      # Preserve the Pages tar format while using the Node 24 artifact action.
      - name: Package Pages artifact
        if: matrix.checks && github.ref == 'refs/heads/main'
        run: |
          tar --dereference --hard-dereference --directory web/dist \
            --exclude=.git --exclude=.github --exclude='.[^/]*' \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        if: matrix.checks && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The one check of the production policy.worker.js with real numbers: tiny
  # exported graphs run through it and the reduced WASM runtime, and must
  # match the Python reference outputs.
  worker:
    name: browser worker parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Pinned export tools, then both engines built and installed as wheels.
      - name: Install the export tools and the real Python engines
        uses: ./.github/actions/python-engines
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test exported policies through the worker and reduced WASM runtime
        run: |
          python -m neural.tests.export_worker_fixture "$RUNNER_TEMP/policy-fixture"
          node web/tests/policy-export-parity.mjs "$RUNNER_TEMP/policy-fixture"

  # Publishes once every job above has passed, each web shard among them.
  deploy:
    name: publish
    needs: [web, audit, engine, worker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
