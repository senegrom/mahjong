name: Import approved Van Gogh nine bamboo
on:
  push:
    branches: [art/van-gogh-nine-wind-chime-0aa8568]
permissions:
  contents: write
concurrency:
  group: import-van-gogh-nine
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'senegrom/mahjong'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-nine-wind-chime-0aa8568
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assemble exact approved artwork and verify preservation
        run: python3 .art-import-nine/import.py
      - name: Install locked web test dependencies
        working-directory: web
        run: npm ci
      - name: Test all tile faces and bamboo export regressions
        working-directory: web
        run: node --test tests/tile-faces.test.js tests/van-gogh-raft.test.js tests/van-gogh-six-bamboo.test.js tests/van-gogh-nine-bamboo.test.js
      - name: Lint the changed JavaScript
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs tests/tile-faces.test.js tests/van-gogh-nine-bamboo.test.js --max-warnings 0
      - name: Commit only verified artwork and integration changes
        run: |
          git add --all
          python3 - <<'PY'
          import subprocess
          allowed = {
            'docs/design/van-gogh/README.md',
            'docs/design/van-gogh/nine-bamboo-wind-chime.json',
            'docs/design/van-gogh/studies/16-nine-bamboo-wind-chime-a-approved.svg',
            'web/public/tiles/van-gogh/approved/Sou9.svg',
            'web/public/tiles/van-gogh/README.md',
            'web/public/tiles/van-gogh/manifest.json',
            'web/public/tiles/van-gogh/preview.html',
            'web/scripts/export-van-gogh-tiles.mjs',
            'web/src/lib/van-gogh-faces.js',
            'web/tests/tile-faces.test.js',
            'web/tests/van-gogh-nine-bamboo.test.js',
            '.github/workflows/import-van-gogh-nine.yml',
          }
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed and not p.startswith('.art-import-nine/')]
          assert not unexpected, unexpected
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add approved Van Gogh 9 bamboo — Moonlit Wind Chime A'
          git push origin HEAD:refs/heads/art/van-gogh-nine-wind-chime-0aa8568
