name: reduced ONNX runtime

# Rebuild the browser runtime from the reviewed operator list on main.
# The loader patcher must recognize its memory-bounding edits. The tested
# tree is pushed to an automation/ branch and the job summary links to a
# compare page: GitHub Actions may not open pull requests in this repository,
# and one opened with the workflow token would start no checks. Open the pull
# request from that link and merge only after its checks pass. This workflow
# never rebases or pushes main. Do not bypass review or enable automatic
# merging here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reduced-onnx-runtime
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install tracked runtime build tools in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/runtime-venv"
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip install -r web/runtime/requirements-build.txt
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip check
          echo "$RUNNER_TEMP/runtime-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked web dependencies
        run: npm ci --prefix web
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build the runtime from the operator list
        shell: bash
        run: |
          set -euxo pipefail
          ORT="$RUNNER_TEMP/onnxruntime"
          git clone --depth 1 --branch v1.29.0 --recurse-submodules --shallow-submodules https://github.com/microsoft/onnxruntime.git "$ORT"
          cat web/runtime/reduced-ops.config
          "$ORT/build.sh" \
            --config MinSizeRel \
            --build_wasm \
            --target onnxruntime_webassembly \
            --enable_wasm_simd \
            --enable_wasm_threads \
            --skip_tests \
            --compile_no_warning_as_error \
            --disable_wasm_exception_catching \
            --disable_rtti \
            --disable_ml_ops \
            --disable_contrib_ops \
            --disable_generation_ops \
            --include_ops_by_config "$GITHUB_WORKSPACE/web/runtime/reduced-ops.config" \
            --parallel \
            --skip_submodule_sync
          wasm=$(find "$ORT/build" -type f -name 'ort-wasm-simd-threaded.wasm' -print -quit)
          loader=$(find "$ORT/build" -type f -name 'ort-wasm-simd-threaded.mjs' -print -quit)
          test -n "$wasm" && test -f "$wasm"
          test -n "$loader" && test -f "$loader"
          cp "$wasm" "$RUNNER_TEMP/built.wasm"
          cp "$loader" "$RUNNER_TEMP/built.mjs"
      - name: Take the binary and restore the loader memory bounds
        shell: bash
        run: |
          set -euxo pipefail
          cp "$RUNNER_TEMP/built.wasm" web/runtime/ort-wasm-simd-threaded.wasm
          cp "$RUNNER_TEMP/built.mjs" "$RUNNER_TEMP/loader-emitted.mjs"
          diff -u web/runtime/ort-wasm-simd-threaded.stock.mjs "$RUNNER_TEMP/built.mjs" > "$RUNNER_TEMP/loader.diff" || true
          cp "$RUNNER_TEMP/built.mjs" web/runtime/ort-wasm-simd-threaded.stock.mjs
          python3 web/scripts/patch-ort-loader.py \
            web/runtime/ort-wasm-simd-threaded.stock.mjs \
            web/runtime/ort-wasm-simd-threaded.mjs
          generic=$(stat -c %s web/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm)
          reduced=$(stat -c %s web/runtime/ort-wasm-simd-threaded.wasm)
          echo "reduced_bytes=$reduced" | tee /tmp/runtime-size.txt
          echo "generic_bytes=$generic" | tee -a /tmp/runtime-size.txt
      - name: Build the web app
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v wasm-pack >/dev/null || [ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
          cd web
          npm run wasm
          npm run build
      - name: Record the exact tree that will be tested
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 web/scripts/runtime_publication.py snapshot /tmp/runtime-receipt.json --expected-head "$SOURCE_SHA"
      - name: Prepare verified network for the memory regression
        run: node web/scripts/prepare-test-network.mjs "$RUNNER_TEMP/mahjong-memory-model.onnx"
      - name: Run every web regression
        shell: bash
        env:
          MAHJONG_NETWORK: ${{ runner.temp }}/mahjong-memory-model.onnx
        run: |
          set -euxo pipefail
          cd web
          npm run test:unit 2>&1 | tee /tmp/runtime-unit.txt
          npm run test:browser 2>&1 | tee /tmp/runtime-browser.txt
      - name: Push the unchanged tested tree to a branch for review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 web/scripts/runtime_publication.py verify /tmp/runtime-receipt.json --expected-head "$SOURCE_SHA"
          if git diff --cached --quiet; then
            echo 'No runtime changes to propose.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tested_tree=$(git write-tree)
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Rebuild the tested reduced browser runtime'
          test "$(git rev-parse 'HEAD^{tree}')" = "$tested_tree"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --quiet
          branch="automation/reduced-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee /tmp/runtime-commit.txt
          # A person opens the pull request, so its ordinary checks run.
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          echo "$compare" | tee /tmp/runtime-compare.txt
          # shellcheck disable=SC2016 # the backticks are Markdown
          printf '### Rebuilt runtime ready for review\n\nSource `%s`, tested tree `%s`, pushed to `%s`.\n\n**[Open a pull request from it](%s)** and merge only after its checks pass. Nothing was rebased or pushed to main.\n' \
            "$SOURCE_SHA" "$tested_tree" "$branch" "$compare" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reduced-onnx-runtime-${{ github.run_attempt }}
          path: |
            /tmp/runtime-size.txt
            /tmp/runtime-unit.txt
            /tmp/runtime-browser.txt
            /tmp/runtime-receipt.json
            /tmp/runtime-commit.txt
            /tmp/runtime-compare.txt
            ${{ runner.temp }}/loader-emitted.mjs
            ${{ runner.temp }}/loader.diff
            web/runtime/reduced-ops.config
            web/runtime/ort-wasm-simd-threaded.wasm
            web/runtime/ort-wasm-simd-threaded.mjs
          if-no-files-found: ignore
          retention-days: 14
