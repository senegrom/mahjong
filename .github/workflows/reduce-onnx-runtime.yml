name: verify reduced ONNX runtime and review fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/reduce-onnx-runtime.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reduced-onnx-runtime
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Apply scoped review fixes
        run: |
          git apply --check .runtime-change/application.patch
          git apply .runtime-change/application.patch
          cd web
          npm ci

      - name: Build model-specific ONNX Runtime 1.29.0
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user ninja onnx
          ORT="$RUNNER_TEMP/onnxruntime"
          git clone --depth 1 --branch v1.29.0 --recurse-submodules --shallow-submodules https://github.com/microsoft/onnxruntime.git "$ORT"
          mkdir -p web/runtime
          python3 "$ORT/tools/python/util/create_reduced_build_config.py" web/public/model.onnx web/runtime/reduced-ops.config
          echo 'Required operators:'
          cat web/runtime/reduced-ops.config
          pushd "$ORT/cmake/external/emsdk"
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          popd
          "$ORT/build.sh" \
            --config MinSizeRel \
            --build_wasm \
            --enable_wasm_simd \
            --enable_wasm_threads \
            --skip_tests \
            --disable_wasm_exception_catching \
            --disable_rtti \
            --disable_ml_ops \
            --include_ops_by_config "$GITHUB_WORKSPACE/web/runtime/reduced-ops.config" \
            --parallel \
            --skip_submodule_sync
          wasm=$(find "$ORT/build" -type f -name 'ort-wasm-simd-threaded.wasm' | head -n1)
          loader=$(find "$ORT/build" -type f -name 'ort-wasm-simd-threaded.mjs' | head -n1)
          test -n "$wasm" && test -f "$wasm"
          test -n "$loader" && test -f "$loader"
          cp "$wasm" web/runtime/ort-wasm-simd-threaded.wasm
          cp "$loader" web/runtime/ort-wasm-simd-threaded.mjs
          sha256sum web/public/model.onnx | awk '{print $1}' > web/runtime/model.sha256
          generic=$(stat -c %s web/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm)
          reduced=$(stat -c %s web/runtime/ort-wasm-simd-threaded.wasm)
          python3 - "$generic" "$reduced" <<'PY' | tee /tmp/runtime-size.txt
          import sys
          old, new = map(int, sys.argv[1:])
          print(f'generic_bytes={old}')
          print(f'reduced_bytes={new}')
          print(f'reduction_percent={(old-new)*100/old:.2f}')
          if new >= old:
              raise SystemExit('Reduced runtime is not smaller than the package runtime')
          PY

      - name: Build and run every web regression
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v wasm-pack >/dev/null || [ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
          cd web
          npm run wasm
          npm run lint
          npm run check
          npm run build
          npm run test:unit 2>&1 | tee /tmp/runtime-unit.txt
          npm run test:browser 2>&1 | tee /tmp/runtime-browser.txt
          node scripts/check-icons.mjs
          node scripts/check-icons.mjs --built

      - name: Commit exact tested build directly to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          original=$(git rev-parse HEAD)
          git rm .github/workflows/reduce-onnx-runtime.yml .runtime-change/application.patch
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Reduce ONNX runtime and fix full-app review findings'
          git fetch origin main
          remote=$(git rev-parse origin/main)
          if [ "$remote" != "$original" ]; then
            if ! git diff --quiet "$original" "$remote" -- README.md web; then
              echo 'Concurrent application changes detected; refusing to overwrite them.' >&2
              exit 1
            fi
            git rebase origin/main
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          git rev-parse HEAD | tee /tmp/runtime-commit.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reduced-onnx-runtime-verification
          path: |
            /tmp/runtime-size.txt
            /tmp/runtime-unit.txt
            /tmp/runtime-browser.txt
            /tmp/runtime-commit.txt
            web/test-results
            web/runtime/reduced-ops.config
            web/runtime/model.sha256
          if-no-files-found: ignore
          retention-days: 7
