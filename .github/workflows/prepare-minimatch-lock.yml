name: Normalize minimatch repair lockfile metadata
on:
  push:
    branches: [fix/minimatch-audit-20261031]
    paths: [.github/workflows/prepare-minimatch-lock.yml]
permissions:
  contents: read
jobs:
  lockfile:
    if: github.repository == 'senegrom/mahjong'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Restore only unchanged packages' platform metadata dropped by npm 10
        working-directory: web
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const original = JSON.parse(execFileSync('git', ['show', 'dbd60afbca5c0ea93e4f1f054dec3a17b4728972:web/package-lock.json'], { encoding: 'utf8' }));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          let restored = 0;
          for (const [path, old] of Object.entries(original.packages)) {
            const now = lock.packages[path];
            if (!old.libc || !now || now.libc) continue;
            const stripped = { ...old }; delete stripped.libc;
            if (JSON.stringify(stripped) !== JSON.stringify(now)) throw new Error(`Unexpected metadata change: ${path}`);
            lock.packages[path] = old; restored++;
          }
          if (restored !== 6) throw new Error(`Expected six unchanged optional packages, found ${restored}`);
          writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log(`Restored libc metadata for ${restored} unchanged optional packages`);
          JS
          node --test tests/dependency-security.test.js
          node scripts/npm-audit.mjs
          git diff --check
      - name: Verify the regression rejects vulnerable direct and nested copies
        working-directory: web
        run: |
          node --input-type=module <<'JS'
          import { mkdtempSync, mkdirSync, copyFileSync, writeFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const directory = mkdtempSync(join(tmpdir(), 'minimatch-regression-'));
          try {
            mkdirSync(join(directory, 'tests'));
            copyFileSync('tests/dependency-security.test.js', join(directory, 'tests', 'check.mjs'));
            const cases = [
              ['patched', { 'node_modules/minimatch': { version: '11.0.1' } }, 0],
              ['vulnerable direct', { 'node_modules/minimatch': { version: '10.2.6' } }, 1],
              ['vulnerable nested', { 'node_modules/minimatch': { version: '11.0.3' }, 'node_modules/parent/node_modules/minimatch': { version: '10.2.6' } }, 1],
              ['vulnerable alias', { 'node_modules/alias': { version: '10.2.6', resolved: 'https://registry.npmjs.org/minimatch/-/minimatch-10.2.6.tgz' } }, 1],
            ];
            for (const [name, packages, expected] of cases) {
              writeFileSync(join(directory, 'package-lock.json'), JSON.stringify({ packages }));
              const result = spawnSync(process.execPath, ['--test', join(directory, 'tests', 'check.mjs')], { encoding: 'utf8', timeout: 10000 });
              if (result.status !== expected) throw new Error(`${name}: unexpected result ${result.status}\n${result.stdout}\n${result.stderr}`);
              console.log(`${name}: expected exit ${expected} verified`);
            }
          } finally { rmSync(directory, { recursive: true, force: true }); }
          JS
      - name: Save only the corrected lockfile to the repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='fix/minimatch-audit-20261031'
          test "$GITHUB_REPOSITORY" = 'senegrom/mahjong'
          test "$GITHUB_REF_NAME" = "$branch"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
          test "$current" = "$EXPECTED_HEAD" || { echo 'Repair branch changed; refusing to publish.'; exit 1; }
          original=$(git rev-parse HEAD:web/package-lock.json)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/web/package-lock.json" \
            -f message='Preserve optional-platform metadata in minimatch security update' \
            -f branch="$branch" -f sha="$original" \
            -f content="$(base64 -w0 web/package-lock.json)" \
            --jq '{commit: .commit.sha, blob: .content.sha}'
