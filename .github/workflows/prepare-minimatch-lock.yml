name: Prepare minimatch repair lockfile
on:
  push:
    branches: [fix/minimatch-audit-20261031]
    paths: [.github/workflows/prepare-minimatch-lock.yml]
permissions:
  contents: read
jobs:
  lockfile:
    if: github.repository == 'senegrom/mahjong'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Resolve the patched dependency without executing installation scripts
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --test tests/dependency-security.test.js
          node scripts/npm-audit.mjs
          git diff --check
      - name: Save only the generated lockfile to the repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='fix/minimatch-audit-20261031'
          test "$GITHUB_REPOSITORY" = 'senegrom/mahjong'
          test "$GITHUB_REF_NAME" = "$branch"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
          test "$current" = "$EXPECTED_HEAD" || { echo 'Repair branch changed; refusing to publish.'; exit 1; }
          if git diff --quiet -- web/package-lock.json; then exit 0; fi
          original=$(git rev-parse HEAD:web/package-lock.json)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/web/package-lock.json" \
            -f message='Regenerate npm lockfile with patched minimatch' \
            -f branch="$branch" -f sha="$original" \
            -f content="$(base64 -w0 web/package-lock.json)" \
            --jq '{commit: .commit.sha, blob: .content.sha}'
