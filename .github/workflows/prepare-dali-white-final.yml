name: Finish approved Dali White Dragon A
on:
  push:
    branches: [art/dali-white-a-finish-20261019]
    paths:
      - .dali-white-final/**
      - .github/workflows/prepare-dali-white-final.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Recover exact prepared artwork
        run: git fetch --no-tags --depth=1 origin eb36fce4be34dc1d2408fd9e2b9780c9705c8ae0
      - name: Integrate only White Dragon A and verify other artwork
        run: node .dali-white-final/prepare.mjs
      - name: Install verification dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Run artist and tile regressions
        working-directory: web
        run: node --test tests/dali-*.test.js tests/tile-faces.test.js
      - name: Lint changed exporter and tile tests
        working-directory: web
        run: npx eslint scripts/export-dali-tiles.mjs tests/dali-*.test.js tests/tile-faces.test.js --max-warnings 0
      - name: Commit clean verified tree on this preparation branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .dali-white-final .github/workflows/prepare-dali-white-final.yml
          git add docs/design/dali web/public/tiles/dali web/scripts/export-dali-tiles.mjs web/src/lib/dali-faces.js web/tests/dali-*.test.js web/tests/tile-faces.test.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Integrate selected White Dragon A while preserving Seven Disks and all other artwork'
          git push origin HEAD:refs/heads/art/dali-white-a-finish-20261019
          git rev-parse HEAD HEAD^{tree}
