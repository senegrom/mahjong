name: native review toolchain
on:
  push:
    branches: [validation/world-integrity-wheels-20260915]
    paths: [.github/workflows/native-review-toolchain.yml]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Package compiler and native standard libraries
        run: |
          root=$(rustc --print sysroot)
          tar -czf /tmp/native-toolchain.tar.gz -C "$root" bin/rustc bin/rustfmt lib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-review-toolchain
          path: /tmp/native-toolchain.tar.gz
          retention-days: 1
