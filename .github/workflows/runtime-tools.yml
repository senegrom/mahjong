name: Runtime maintenance checks

# The rebuild's publication guard, tested without the rebuild. The build tools
# in web/runtime/requirements-build.txt are installed and checked by the
# rebuild itself (reduce-onnx-runtime.yml), the only place they run.
on:
  push:
    branches: [main]
    paths:
      - 'web/scripts/*runtime_publication.py'
      - '.github/workflows/runtime-tools.yml'
      - '.github/workflows/reduce-onnx-runtime.yml'
  pull_request:
    paths:
      - 'web/scripts/*runtime_publication.py'
      - '.github/workflows/runtime-tools.yml'
      - '.github/workflows/reduce-onnx-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Replay offline Git publication regressions
        run: python -m unittest discover -s web/scripts -p test_runtime_publication.py -v
      # No runtime rebuild, branch push, pull request creation or deployment here.
