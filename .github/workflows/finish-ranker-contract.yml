name: finish ranker contract
on:
  push:
    branches: [fix/full-review-20260916]
    paths: [.github/workflows/finish-ranker-contract.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Keep owned identity separate from user metadata on reload
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('neural/sibling_head.py')
          expected = '3a41c7230a5670c24e89d416d9787044c33d091d'
          if subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() != expected:
              raise SystemExit('Sibling head changed; refusing an unreviewed replacement')
          old = 'return head, {k: v for k, v in payload.items() if k not in ("ranker", "channels")}'
          new = 'return head, {k: v for k, v in payload.items()\n                  if k not in ("ranker", "channels", "feature_contract")}'
          source = path.read_text()
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
          git rm .github/workflows/finish-ranker-contract.yml
          git add neural/sibling_head.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep bound ranker identity on the head rather than in re-save metadata'
          git push origin HEAD:refs/heads/fix/full-review-20260916
