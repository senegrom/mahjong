name: teacher review workspace

on:
  push:
    branches: [fix/teacher-review-20260916]
    paths: [.github/workflows/teacher-review-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install the native build tool
        run: python -m pip install 'maturin>=1.7,<2'
      - name: Fetch both locked dependency graphs
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path engine/libriichi/Cargo.toml
      - name: Package offline compiler and public dependencies only
        run: |
          mkdir -p review-tools
          cp "$(command -v maturin)" review-tools/maturin
          tar -C "$HOME/.rustup/toolchains" -czf review-tools/toolchain.tar.gz 1.98.1-x86_64-unknown-linux-gnu
          tar -C "$HOME/.cargo" -czf review-tools/registry.tar.gz registry
          sha256sum review-tools/* > review-tools/SHA256SUMS
      - name: Upload the offline test toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teacher-review-tools
          path: review-tools
          retention-days: 1
          if-no-files-found: error
