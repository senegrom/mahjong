name: teacher review workspace

on:
  push:
    branches: [fix/teacher-review-20260916]
    paths: [.github/workflows/teacher-review-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Package the reviewed source
        run: |
          mkdir -p review-workspace
          git archive HEAD neural engine Cargo.toml Cargo.lock docs .github web/runtime/reduced-ops.config | gzip > review-workspace/source.tar.gz
          git rev-parse HEAD > review-workspace/revision.txt
      - name: Install the native build tool
        run: python -m pip install 'maturin>=1.7,<2'
      - name: Build both Python engines
        run: |
          cd engine/riichi-py
          maturin build --release --locked --out ../../review-workspace
          cd ../libriichi
          maturin build --release --locked --out ../../review-workspace
      - name: Upload the isolated review workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teacher-review-workspace
          path: review-workspace
          retention-days: 1
          if-no-files-found: error
