name: apply training integrity fixes
on:
  push:
    branches: [fix/training-integrity-20260911]
    paths: [.github/workflows/apply-integrity-fixes.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/fix/training-integrity-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply verified patch and preserve the original policy softmax
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, re, subprocess, zlib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD^') == '441a746f65ce20cefe2c29a12e3d2ab246566301'
          original = pathlib.Path('.github/workflows/prepare-integrity-fixes.yml').read_text()
          encoded = re.search("encoded = '''(.*?)'''", original, re.S).group(1)
          encoded = ''.join(encoded.split()).replace('OaeaxEaxEoLIw', 'OaeaxEoLIw').replace('ZSBGGpy9VD', 'ZSBGpy9VD')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '05a9d140f277286ba5c72ea7fec677fbf62558fb4aaf2425f94293c8b622930f'
          # The new alias-display helper is separate from the existing softmax.
          patch = patch.replace(b'policy-weights.js', b'action-weights.js').replace(b'policy-weights.test.js', b'policy-alias-weights.test.js')
          assert hashlib.sha256(patch).hexdigest() == '2789ad7fed6229c85f15b0c235b6341d59e1a80deafd579123ef49047b5351c9'
          path = pathlib.Path('/tmp/training-integrity.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          expected = {
            'docs/TRAINING_CORRECTNESS.md': '43292ffbbf04dfb6a0224f9cc749255af2aab8f1',
            'neural/arena.py': 'ccf94012758be693ef405d238acc226a580407dd',
            'neural/duel.py': 'e8e94fec5a255f6ea87e9240be15b67995568c38',
            'neural/outcomes.py': 'd5e41ef3217b402bdaa0fef87c4ee871b4c6c2d0',
            'neural/replay.py': '406bf16b4bcf7ed1f16f426e46b321d588aaee11',
            'neural/searched.py': '8e2dc2aa5fb66cb40221679a7c3f7e96f314fb23',
            'neural/selfplay.py': 'd694671aafff6fa45e3d02c0eba59e60a34990ca',
            'neural/tests/test_outcomes.py': '2c00b1093d7a20cb2084b5b3b4da6658ddc1edd8',
            'neural/tests/test_replay_atomic.py': 'd7f0f9d05e72dd2bdcd735514275c6d006a4568f',
            'neural/tests/test_selfplay_accounting.py': '2045cc8477262a9ad6f0a7213b0c24cc761b4f90',
            'web/scripts/adviser-review-check.mjs': '5e00b2852c16e82a8c2fdf86f5033145bd136859',
            'web/src/lib/agents.js': 'e798ace4253b995bdd78f9af7b862c319caa6f50',
            'web/src/lib/action-weights.js': '96a629a99fcd6259a017eb3e55b20929c1564814',
            'web/src/lib/review-policy.js': '9bb1a1058ec6502603399187cdc583a506627ff7',
            'web/tests/policy-alias-weights.test.js': '1db783d63acdd89168613e6daf7e3132e8d7610a',
          }
          for name, sha in expected.items():
              assert git('hash-object', name) == sha, name
              if name.endswith(('.js', '.mjs')):
                  subprocess.run(['node', '--check', name], check=True)
          assert git('hash-object', 'web/src/lib/policy-weights.js') == 'a8fcffacf20081f7695f2ca34ed337dfd12d45d5'
          subprocess.run(['python', '-m', 'compileall', '-q', 'neural'], check=True)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          preparation = ['.github/workflows/prepare-integrity-fixes.yml', '.github/workflows/apply-integrity-fixes.yml']
          subprocess.run(['git', 'rm', *preparation], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(expected) | set(preparation)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--stat'], check=True)
          PY
      - name: Commit only to the isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = senegrom/mahjong
          test "$GITHUB_REF" = refs/heads/fix/training-integrity-20260911
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix training settlement, tied outcomes, truncation, atomic replay and policy aliases'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/fix/training-integrity-20260911
          echo "Repair commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
