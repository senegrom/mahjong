name: review native check
on:
  push:
    branches: [fix/review-six-20260913]
permissions:
  contents: read
jobs:
  native:
    if: github.ref == 'refs/heads/fix/review-six-20260913'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-six-20260913
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: false
      - name: Name the Python leaf batch result
        id: repair
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('engine/riichi-py/src/lib.rs')
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'd8a6fb5ef03106fc43f30575827c31a36eb25e6de1c44dad50f8a648e8b4f148'
          text = data.decode()
          old = "PyResult<(Bound<'py, PyBytes>, Vec<usize>, Vec<f32>, Vec<u8>)>"
          assert text.count(old) == 3
          text = text.replace(old, "PyResult<LeafBatch<'py>>")
          marker = '/// One game, and where its next decision sits.'
          assert text.count(marker) == 1
          text = text.replace(marker, "/// Native leaf bytes, per-game counts, settled rewards and wanted-value mask.\ntype LeafBatch<'py> = (Bound<'py, PyBytes>, Vec<usize>, Vec<f32>, Vec<u8>);\n\n" + marker)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/review-native-check.yml
          git add engine/riichi-py/src/lib.rs
          git commit -m 'Name the shared Python leaf result without relaxing Rust lint'
          git push origin HEAD:fix/review-six-20260913
          git archive --format=tar.gz --output=/tmp/native-repaired-source.tar.gz HEAD engine/riichi-py/src/lib.rs engine/riichi-core/src/search.rs
      - name: Build updated Python test wheels
        id: wheels
        if: ${{ !cancelled() && steps.repair.outcome == 'success' }}
        run: |
          python -m pip install 'maturin>=1.7,<2'
          (cd engine/riichi-py && maturin build --release --locked --out /tmp/review-wheels)
          (cd engine/libriichi && maturin build --release --locked --out /tmp/review-wheels)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.wheels.outcome == 'success' }}
        with:
          name: native-repaired-wheels
          path: /tmp/review-wheels
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.repair.outcome == 'success' }}
        with:
          name: native-repaired-source
          path: /tmp/native-repaired-source.tar.gz
          retention-days: 1
      - name: Rust lint
        if: ${{ !cancelled() && steps.repair.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust regression tests
        if: ${{ !cancelled() && steps.repair.outcome == 'success' }}
        run: cargo test --locked --workspace
