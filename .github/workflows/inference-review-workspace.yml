name: inference review workspace
on:
  push:
    branches: [fix/inference-parity-bounds-20260916]
    paths: [.github/workflows/inference-review-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Package source and native engines for regression tests
        run: |
          mkdir -p review-workspace
          git archive HEAD | gzip > review-workspace/source.tar.gz
          git rev-parse HEAD > review-workspace/revision.txt
          python -m pip install 'maturin>=1.7,<2'
          python -m pip download 'onnx>=1.17,<2' 'onnxruntime>=1.22,<2' --dest review-workspace/packages
          cd engine/riichi-py
          maturin build --release --locked --out ../../review-workspace
          cd ../libriichi
          maturin build --release --locked --out ../../review-workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: inference-review-workspace
          path: review-workspace
          retention-days: 1
          if-no-files-found: error
