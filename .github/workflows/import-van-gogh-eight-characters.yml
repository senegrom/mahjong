name: Import approved Van Gogh eight characters

on:
  push:
    branches: [art/van-gogh-eight-olive-grove-66a5db1]
    paths:
      - '.art-import-olive/**'
      - '.github/workflows/import-van-gogh-eight-characters.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-eight-olive-grove-66a5db1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assemble exact olive painting and verify all earlier artwork
        run: python3 .art-import-olive/import.py
      - name: Retain the raft and other featured faces in the fourteen-tile preview
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          path = Path('web/scripts/export-van-gogh-tiles.mjs')
          text = path.read_text()
          replacements = [
              ("const featured = ['8m', '4p', '7m', '6m', '5m', '2m', '3m', '4m', '9p', '3p', '9s', '6s'];", "const featured = ['8m', '4p', '7m', '6m', '5m', '2m', '3m', '4m', '9p', '3p', '9s', '6s', '8s'];"),
              (".slice(0, 12 - featured.length), '2z', '6z'];", ".slice(0, 13 - featured.length), '2z'];"),
              ('The last two tiles use Classic artwork.', 'The last tile uses Classic artwork.'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          path.write_text(text)
          before = {p: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('web/public/tiles').rglob('*') if p.is_file() and p.suffix in {'.svg', '.png', '.webp', '.avif'}}
          outputs = ['web/public/tiles/van-gogh/manifest.json', 'web/public/tiles/van-gogh/preview.html', 'web/src/lib/van-gogh-faces.js']
          command = ['node', str(path), '--only=8m']
          subprocess.run(command, check=True)
          first = {p: Path(p).read_bytes() for p in outputs}
          subprocess.run(command, check=True)
          assert all(Path(p).read_bytes() == b for p, b in first.items())
          assert all(hashlib.sha256(p.read_bytes()).hexdigest() == h for p, h in before.items())
          print('Preview retains all thirteen featured faces plus one Classic fallback; image bytes unchanged.')
          PY
      - name: Install locked web test dependencies
        working-directory: web
        run: npm ci
      - name: Test all tile faces and cross-set export regressions
        working-directory: web
        run: node --test tests/tile-faces.test.js tests/van-gogh-*.test.js tests/dali-*.test.js
      - name: Lint changed JavaScript
        working-directory: web
        run: npx --no-install eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/van-gogh-eight-characters.test.js --max-warnings 0
      - name: Commit verified integration without temporary importer
        run: |
          git rm -r .art-import-olive .github/workflows/import-van-gogh-eight-characters.yml
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-eight-characters.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deploy approved Starry Olive Grove as Van Gogh eight characters'
          git push origin HEAD:refs/heads/art/van-gogh-eight-olive-grove-66a5db1
