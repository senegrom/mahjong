name: review repair validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-validation.yml'
      - '.github/repair.patch'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture the checked-out source for local review
        run: git archive --format=tar HEAD > /tmp/review-source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-source
          path: /tmp/review-source.tar
          retention-days: 1
