name: review repair validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-validation.yml']
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Package native dependencies for offline local regression tests
        run: |
          mkdir -p /tmp/diagnostics/wheels
          python -m pip install 'maturin>=1.7,<2' 'numpy>=2,<3'
          (cd engine/riichi-py && maturin build --release --locked --out /tmp/diagnostics/wheels)
          (cd engine/libriichi && maturin build --release --locked --out /tmp/diagnostics/wheels)
          python -m pip download --only-binary=:all: 'onnx>=1.17,<2' 'onnxruntime>=1.22,<2' --dest /tmp/diagnostics/wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-test-dependencies
          path: /tmp/diagnostics/wheels
          retention-days: 1
      - name: Package browser dependencies and generated bindings
        working-directory: web
        run: |
          if ! command -v wasm-pack >/dev/null; then cargo install wasm-pack --version 0.15.0 --locked; fi
          npm ci
          npm run wasm
          tar czf /tmp/browser-dependencies.tar.gz node_modules src/wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-test-dependencies
          path: /tmp/browser-dependencies.tar.gz
          retention-days: 1
