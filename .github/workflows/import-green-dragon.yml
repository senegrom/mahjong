name: Import approved vineyard green dragon C
on:
  push:
    branches: [art/van-gogh-green-dragon-vineyard-c]
    paths: [.green-dragon-transfer/ready.json]
permissions:
  contents: write
concurrency:
  group: import-green-dragon
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-green-dragon-vineyard-c
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assemble approved artwork and verify preservation
        run: python3 .green-dragon-transfer/install.py
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci
      - name: Test tile faces and artist regressions
        working-directory: web
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/tile-faces.test.js tests/van-gogh-*.test.js tests/dali-*.test.js tests/*proportion*.test.js tests/*offline*.test.js)
          node --test "${tests[@]}"
      - name: Lint changed JavaScript
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs tests/tile-faces.test.js tests/van-gogh-green-dragon.test.js --max-warnings 0
      - name: Commit only verified dragon integration
        run: |
          git rm -r .green-dragon-transfer
          git add docs/design/van-gogh/README.md docs/design/van-gogh/green-dragon-vineyard.json docs/design/van-gogh/studies/25-green-dragon-vineyard-c-approved.svg web/public/tiles/van-gogh/README.md web/public/tiles/van-gogh/approved/Hatsu.svg web/public/tiles/van-gogh/manifest.json web/public/tiles/van-gogh/preview.html web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-green-dragon.test.js
          python3 - <<'PY'
          import subprocess
          allowed = {
            'docs/design/van-gogh/README.md',
            'docs/design/van-gogh/green-dragon-vineyard.json',
            'docs/design/van-gogh/studies/25-green-dragon-vineyard-c-approved.svg',
            'web/public/tiles/van-gogh/README.md',
            'web/public/tiles/van-gogh/approved/Hatsu.svg',
            'web/public/tiles/van-gogh/manifest.json',
            'web/public/tiles/van-gogh/preview.html',
            'web/scripts/export-van-gogh-tiles.mjs',
            'web/src/lib/van-gogh-faces.js',
            'web/tests/tile-faces.test.js',
            'web/tests/van-gogh-green-dragon.test.js',
          }
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          unexpected = [p for p in staged if p not in allowed and not p.startswith('.green-dragon-transfer/')]
          assert not unexpected, unexpected
          assert allowed.issubset(staged)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add approved Vineyard C green dragon for Van Gogh 6z'
          git push origin HEAD:refs/heads/art/van-gogh-green-dragon-vineyard-c
