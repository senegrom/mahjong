name: Import approved Van Gogh nine characters

on:
  push:
    branches: [art/van-gogh-nine-poppies-ff3137d]
    paths:
      - '.art-import-poppies/**'
      - '.github/workflows/import-van-gogh-nine-poppies.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-nine-poppies-ff3137d
          fetch-depth: 0
          persist-credentials: true
      - name: Retain concurrent main changes before importing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assemble approved revised poppies and verify preservation
        run: python3 .art-import-poppies/import.py
      - name: Install locked web test dependencies
        working-directory: web
        run: npm ci
      - name: Test tile faces, artist sets, proportions and offline preparation
        working-directory: web
        run: |
          shopt -s nullglob
          tests=(tests/tile-faces.test.js tests/van-gogh-*.test.js tests/dali-*.test.js tests/*fit*.test.js tests/*offline*.test.js)
          node --test "${tests[@]}"
      - name: Lint integration
        working-directory: web
        run: npx --no-install eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/van-gogh-nine-characters.test.js --max-warnings 0
      - name: Commit verified integration without temporary importer
        run: |
          git rm -r .art-import-poppies .github/workflows/import-van-gogh-nine-poppies.yml
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-nine-characters.test.js
          git diff --cached --check
          git commit -m 'Deploy revised poppy field with smaller Wan as Van Gogh 9 characters'
          git push origin HEAD:refs/heads/art/van-gogh-nine-poppies-ff3137d
