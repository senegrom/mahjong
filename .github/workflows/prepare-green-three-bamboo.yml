name: Prepare approved green Triple Shoots replacement

on:
  push:
    branches: [design/van-gogh-green-three-bamboo-20260925]
    paths:
      - '.sou3-transfer/**'
      - '.github/workflows/prepare-green-three-bamboo.yml'

permissions:
  contents: read

concurrency:
  group: prepare-green-three-bamboo
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/design/van-gogh-green-three-bamboo-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/van-gogh-green-three-bamboo-20260925
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Image export prerequisites
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Replace only the approved three bamboo
        run: python3 .sou3-transfer/install.py
      - name: Lint and tile regressions
        working-directory: web
        run: npm run lint && node --test tests/tile-faces.test.js tests/offline.test.js
      - name: Commit finished assets and remove temporary transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js
          git rm -r .sou3-transfer
          git rm .github/workflows/prepare-green-three-bamboo.yml
          git diff --cached --check
          git commit -m 'feat(tiles): replace Van Gogh three bamboo with green Triple Shoots A'
          git push origin HEAD:refs/heads/design/van-gogh-green-three-bamboo-20260925
