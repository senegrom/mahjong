name: Reconcile approved Van Gogh vineyard
on:
  push:
    branches: [art/van-gogh-five-vineyard-770fcd7]
    paths:
      - '.art-vineyard-reconcile.py'
      - '.github/workflows/reconcile-van-gogh-vineyard.yml'
permissions:
  contents: write
concurrency:
  group: reconcile-van-gogh-vineyard
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-five-vineyard-770fcd7
          fetch-depth: 20
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Preserve concurrent nine disks while merging main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .art-vineyard-reconcile.py
      - name: Install locked test dependencies
        working-directory: web
        run: npm ci
      - name: Test all tile faces and cross-set regressions
        working-directory: web
        run: node --test tests/tile-faces.test.js tests/van-gogh-*.test.js tests/dali-*.test.js
      - name: Lint integration
        working-directory: web
        run: npx --no-install eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/van-gogh-five-characters.test.js --max-warnings 0
      - name: Commit verified reconciliation without temporary workflow
        run: |
          git rm .art-vineyard-reconcile.py .github/workflows/reconcile-van-gogh-vineyard.yml
          git add docs/design/van-gogh/README.md web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'Preserve concurrent Potters Table while integrating Vineyard A'
          git push origin HEAD:refs/heads/art/van-gogh-five-vineyard-770fcd7
