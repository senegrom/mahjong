name: Repair deployment dependency lock

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-dali-deployment-lock.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Resolve only the two patched transitive packages from npm
        working-directory: web
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const targets = [['brace-expansion', '5.0.12'], ['devalue', '5.9.3']];
          const sorted = value => Object.fromEntries(Object.entries(value ?? {}).sort(([a], [b]) => a.localeCompare(b)));
          for (const [name, version] of targets) {
            const current = lock.packages[`node_modules/${name}`];
            assert.ok(current, `Missing existing dependency: ${name}`);
            const response = await fetch(`https://registry.npmjs.org/${name}/${version}`, {
              signal: AbortSignal.timeout(30000),
            });
            assert.ok(response.ok, `Registry returned ${response.status} for ${name}`);
            const metadata = await response.json();
            assert.equal(metadata.name, name);
            assert.equal(metadata.version, version);
            assert.deepEqual(sorted(metadata.dependencies), sorted(current.dependencies), 'No dependency graph changes allowed');
            const tarball = `https://registry.npmjs.org/${name}/-/${name}-${version}.tgz`;
            assert.equal(metadata.dist.tarball, tarball);
            assert.match(metadata.dist.integrity, /^sha512-[A-Za-z0-9+/]+={0,2}$/);
            current.version = version;
            current.resolved = tarball;
            current.integrity = metadata.dist.integrity;
            console.log(`${name}: pinned security patch ${version}`);
          }
          writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Verify installation and security audit without lifecycle scripts
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=low
      - name: Check minimal diff and commit only the dependency lock
        run: |
          git diff --exit-code -- web/package.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:web/package-lock.json'], { encoding: 'utf8' }));
          const after = JSON.parse(readFileSync('web/package-lock.json', 'utf8'));
          assert.deepEqual(Object.keys(after.packages), Object.keys(before.packages));
          const allowed = new Set(['node_modules/brace-expansion', 'node_modules/devalue']);
          for (const name of Object.keys(before.packages)) {
            if (!allowed.has(name)) {
              assert.deepEqual(after.packages[name], before.packages[name], `Unexpected package change: ${name}`);
              continue;
            }
            const clean = entry => {
              const { version, resolved, integrity, ...rest } = entry;
              return rest;
            };
            assert.deepEqual(clean(after.packages[name]), clean(before.packages[name]));
          }
          const { packages: oldPackages, ...oldRoot } = before;
          const { packages: newPackages, ...newRoot } = after;
          assert.deepEqual(newRoot, oldRoot);
          const files = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim();
          assert.ok(files === '' || files === 'web/package-lock.json', `Unexpected files: ${files}`);
          NODE
          if git diff --quiet -- web/package-lock.json; then
            echo 'Both security patch resolutions are already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/package-lock.json
          git commit -m 'Patch brace-expansion and devalue to unblock verified deployment'
          git push origin HEAD:main
