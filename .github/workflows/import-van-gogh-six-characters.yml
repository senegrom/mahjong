name: Import approved Van Gogh six characters

on:
  push:
    branches: [art/van-gogh-six-characters-lemon-5d11280]
    paths:
      - '.art-import-six-characters/**'
      - '.github/workflows/import-van-gogh-six-characters.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/art/van-gogh-six-characters-lemon-5d11280'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-six-characters-lemon-5d11280
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assemble approved six characters and verify preservation
        run: python3 .art-import-six-characters/import.py
      - name: Install locked web test dependencies
        working-directory: web
        run: npm ci
      - name: Test all tile faces and cross-set regressions
        working-directory: web
        run: node --test tests/tile-faces.test.js tests/van-gogh-*.test.js tests/dali-*.test.js
      - name: Lint changed JavaScript
        working-directory: web
        run: npx --no-install eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/van-gogh-six-characters.test.js --max-warnings 0
      - name: Commit verified artwork without temporary importer
        run: |
          git rm -r .art-import-six-characters .github/workflows/import-van-gogh-six-characters.yml
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-six-characters.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deploy approved Lemon Terrace as Van Gogh six characters'
          git push origin HEAD:refs/heads/art/van-gogh-six-characters-lemon-5d11280
