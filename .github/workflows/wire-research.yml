name: Wire research engine bindings
on:
  push:
    branches: [work/selfplay-danger-curriculum-20260921]
    paths: [.github/workflows/wire-research.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'senegrom/mahjong'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Apply bounded native wiring changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','--abbrev-ref','HEAD'],text=True).strip() == 'work/selfplay-danger-curriculum-20260921'
          def replace(path, old, new):
              p=Path(path); text=p.read_text(); assert text.count(old)>=1, (path, old)
              p.write_text(text.replace(old,new,1))
          replace('engine/riichi-py/src/lib.rs','use std::collections::VecDeque;','mod research;\n\nuse std::collections::VecDeque;')
          replace('engine/riichi-py/src/lib.rs','struct Seat {','#[derive(Clone)]\nstruct Seat {')
          replace('engine/riichi-py/src/lib.rs','    module.add_class::<Arena>()?;','    module.add_class::<Arena>()?;\n    research::register(module)?;')
          replace('engine/libriichi/src/follow.rs','struct Table {','#[derive(Clone)]\nstruct Table {')
          replace('engine/libriichi/src/follow.rs','    fn __len__(&self) -> usize {', '''    /// Exact in-memory snapshot, including pending reach flags.
              /// Repeated rows are independent copies for paired continuations.
              fn fork(&self, rows: Vec<usize>) -> PyResult<Self> {
                  if rows.iter().any(|&i| i >= self.tables.len()) {
                      return Err(PyValueError::new_err("snapshot row outside follower"));
                  }
                  Ok(Self { tables: rows.into_iter().map(|i| self.tables[i].clone()).collect(),
                            version: self.version })
              }
          
              fn __len__(&self) -> usize {''')
          subprocess.run(['rustfmt','--edition','2024','engine/riichi-py/src/research.rs','engine/libriichi/src/follow.rs'],check=True)
          subprocess.run(['git','rm','.github/workflows/wire-research.yml'],check=True)
          subprocess.run(['git','add','engine/riichi-py/src/lib.rs','engine/riichi-py/src/research.rs','engine/libriichi/src/follow.rs'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: wire exact simulation and observation snapshots'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/work/selfplay-danger-curriculum-20260921'],check=True)
      - name: Build both real Python engines
        run: |
          python -m pip install 'maturin>=1.7,<2'
          (cd engine/riichi-py && maturin build --release --locked --out ../../wheels)
          (cd engine/libriichi && maturin build --release --locked --out ../../wheels)
          git archive --format=tar.gz HEAD engine > "$RUNNER_TEMP/research-native-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-native-engines
          path: |
            wheels/*.whl
            ${{ runner.temp }}/research-native-source.tar.gz
          retention-days: 7
