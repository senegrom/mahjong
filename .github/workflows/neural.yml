name: neural syntax

on:
  push:
    branches: [main]
    paths:
      - "neural/**"
      - ".github/workflows/neural.yml"
  pull_request:
    paths:
      - "neural/**"
      - ".github/workflows/neural.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: compile Python trainer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Compile neural package
        run: python -m compileall -q neural
