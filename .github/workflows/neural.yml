name: neural trainer

on:
  push:
    branches: [main]
    paths:
      - "neural/**"
      - "engine/libriichi/**"
      - "engine/riichi-py/**"
      - "engine/riichi-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/runtime/reduced-ops.config"
      - ".github/workflows/neural.yml"
  pull_request:
    paths:
      - "neural/**"
      - "engine/libriichi/**"
      - "engine/riichi-py/**"
      - "engine/riichi-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/runtime/reduced-ops.config"
      - ".github/workflows/neural.yml"
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit both Rust dependency graphs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null || [ "$(cargo-audit --version)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
      - name: Audit application and Python engine dependencies
        run: cargo audit
      - name: Audit standalone observation engine dependencies
        working-directory: engine/libriichi
        run: cargo audit

  compile:
    name: test Python trainer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Compile neural package
        run: python -m compileall -q neural
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check follower formatting
        run: rustfmt --edition 2024 --check engine/libriichi/src/follow.rs
      - name: Install CPU training and export dependencies
        run: |
          python -m pip install "numpy>=2,<3" "maturin>=1.7,<2" "onnx>=1.17,<2" "onnxruntime>=1.22,<2"
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Build the training engine
        working-directory: engine/riichi-py
        run: maturin build --release --locked --out ../../wheels
      - name: Build the observation engine
        working-directory: engine/libriichi
        run: maturin build --release --locked --out ../../wheels
      - name: Install the real Python engines
        run: python -m pip install wheels/*.whl
      - name: Test training resume, model export and teacher translation
        run: python -m unittest discover -s neural/tests -v
