name: neural trainer

on:
  push:
    branches: [main]
    paths:
      - "neural/**"
      - "engine/libriichi/**"
      - "engine/riichi-py/**"
      - "engine/riichi-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/runtime/**"
      - ".github/actions/python-engines/**"
      - ".github/workflows/neural.yml"
  pull_request:
    paths:
      - "neural/**"
      - "engine/libriichi/**"
      - "engine/riichi-py/**"
      - "engine/riichi-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/runtime/**"
      - ".github/actions/python-engines/**"
      - ".github/workflows/neural.yml"
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The root dependency graph is audited by the build workflow on every change.
  audit:
    name: audit the observation engine's dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null || [ "$(cargo-audit --version)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
      - name: Audit standalone observation engine dependencies
        working-directory: engine/libriichi
        run: cargo audit

  compile:
    name: test Python trainer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile neural package
        run: python -m compileall -q neural
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The vendored crate is its own workspace, so the build workflow's
      # workspace tests never run its tests. Without pymod they need no
      # Python; that leaves out only the arena's one test.
      - name: Test the observation engine
        working-directory: engine/libriichi
        run: cargo test --locked --no-default-features --lib
      # The same pinned tools and engine wheels as the build workflow's
      # browser worker parity job.
      - name: Install the training tools and the real Python engines
        uses: ./.github/actions/python-engines
      # The browser worker parity check runs in the build workflow, which
      # publishes the site only after it passes.
      - name: Run the trainer's tests
        run: python -m unittest discover -s neural/tests -v
