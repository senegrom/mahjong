name: prepare browser harness cleanup
on:
  push:
    branches: [fix/review-repairs-20260910]
    paths: ['.github/workflows/branch-repair.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/fix/review-repairs-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply locally tested harness cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          new = r'''async function check(name, fn) {
            const failures = [];
            try { await fn(); } catch (error) { failures.push(error); }
            // A test may share several tabs, but no context should survive into the next
            // test with its WASM engine, workers and service workers still running.
            const closed = await Promise.allSettled(contexts.splice(0).map(async context => context.close()));
            for (const result of closed) {
              if (result.status === 'rejected') failures.push(result.reason);
            }
            if (failures.length) {
              const error = failures.map(failure => failure?.stack ?? String(failure)).join('\n');
              results.push({ name, passed: false, error });
              console.error(`FAIL ${name}\n${error}`);
            } else {
              results.push({ name, passed: true });
              console.log(`PASS ${name}`);
            }
          }'''
          for name, sha in [('ui-regression.mjs','83a8d47286f1a84b1231b5c753492bdd59d8d6ee'),('full-review-check.mjs','8eebb1560d76dc03926576ff4c7cd97c093f2b15')]:
              p = Path('web/scripts') / name
              actual = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
              assert actual == sha, (name,actual)
              s = p.read_text()
              a = s.index('async function check(')
              b = s.index('\nfunction contrast(', a) if name == 'ui-regression.mjs' else s.index('\nasync function open(',a)
              p.write_text(s[:a] + new + s[b:])
          PY
          cat > web/tests/browser-harness-cleanup.test.js <<'JS'
          /** Run the actual harness wrapper without starting Chromium or an HTTP server. */
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          import { setImmediate } from 'node:timers/promises';
          import ts from 'typescript';
          
          function harness(name) {
            const source = readFileSync(new URL(`../scripts/${name}`, import.meta.url), 'utf8');
            const tree = ts.createSourceFile(name, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.JS);
            const wrapper = tree.statements.find(node => ts.isFunctionDeclaration(node) && node.name?.text === 'check');
            assert.ok(wrapper, `${name} must have a test wrapper`);
            const contexts = [], results = [];
            const check = vm.runInNewContext(`(${wrapper.getText(tree)})`, {
              contexts, results, console: { log() {}, error() {} },
            });
            return { contexts, results, check };
          }
          
          for (const name of ['ui-regression.mjs', 'full-review-check.mjs']) {
            test(`${name}: consecutive cases release their own contexts before the next case`, async () => {
              const { contexts, results, check } = harness(name);
              let live = 0, maximum = 0;
              for (let index = 0; index < 50; index++) {
                await check(`case ${index}`, async () => {
                  for (let context = 0; context < 2; context++) {
                    live++;
                    contexts.push({ async close() { await setImmediate(); live--; } });
                  }
                  maximum = Math.max(maximum, live);
                  assert.equal(live, 2, 'shared tabs must remain alive until their test finishes');
                });
                assert.equal(live, 0, 'the next case must not inherit active browser contexts');
                assert.equal(contexts.length, 0);
              }
              assert.equal(maximum, 2);
              assert.equal(results.length, 50);
              assert.ok(results.every(result => result.passed));
            });
          
            test(`${name}: assertion failures still close every context`, async () => {
              const { contexts, results, check } = harness(name);
              let closed = 0;
              await check('failed assertion', async () => {
                contexts.push({ async close() { closed++; } }, { async close() { closed++; } });
                throw new Error('original assertion');
              });
              assert.equal(closed, 2);
              assert.equal(contexts.length, 0);
              assert.equal(results[0].passed, false);
              assert.match(results[0].error, /original assertion/);
            });
          
            test(`${name}: cleanup errors fail the case and do not prevent other contexts closing`, async () => {
              const { contexts, results, check } = harness(name);
              let otherClosed = false;
              await check('cleanup failure', async () => {
                contexts.push(
                  { close() { throw new Error('failed closing context'); } },
                  { async close() { await setImmediate(); otherClosed = true; } },
                );
              });
              assert.equal(otherClosed, true);
              assert.equal(contexts.length, 0);
              assert.equal(results.length, 1);
              assert.equal(results[0].passed, false);
              assert.match(results[0].error, /failed closing context/);
            });
          
            test(`${name}: assertion and cleanup errors are both reported`, async () => {
              const { contexts, results, check } = harness(name);
              await check('combined failures', async () => {
                contexts.push({ async close() { throw new Error('cleanup diagnostic'); } });
                throw new Error('assertion diagnostic');
              });
              assert.equal(contexts.length, 0);
              assert.equal(results.length, 1);
              assert.equal(results[0].passed, false);
              assert.match(results[0].error, /assertion diagnostic/);
              assert.match(results[0].error, /cleanup diagnostic/);
            });
          }
          JS
          python - <<'PY'
          import subprocess
          expected = {
              'web/scripts/ui-regression.mjs': 'e990c15705b7abffed9f685a643a67b9ba617601',
              'web/scripts/full-review-check.mjs': '550cee7f3c666849695a4d134236fae405cf13b4',
              'web/tests/browser-harness-cleanup.test.js': 'af12509c524cdc1c123c7f5b049b8c6ddab47839',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual == sha, (path, actual, sha)
              subprocess.run(['node','--check',path],check=True)
          subprocess.run(['git','add','--'] + list(expected),check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Create candidate commit without changing branch references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'senegrom/mahjong'
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/review-repairs-20260910'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA']
          names = git('diff','--cached','--name-only').splitlines()
          assert set(names) == {'web/scripts/ui-regression.mjs','web/scripts/full-review-check.mjs','web/tests/browser-harness-cleanup.test.js'}
          entries = [dict(path=n,mode='100644',type='blob',content=pathlib.Path(n).read_text()) for n in names]
          entries.append(dict(path='.github/workflows/branch-repair.yml',mode='100644',type='blob',sha=None))
          def post(kind,payload):
              request = urllib.request.Request('https://api.github.com/repos/senegrom/mahjong/git/' + kind, data=json.dumps(payload).encode(), headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          tree = post('trees',dict(base_tree=git('rev-parse','HEAD^{tree}'),tree=entries))
          commit = post('commits',dict(message='Release browser test contexts between cases and report cleanup failures',tree=tree['sha'],parents=[os.environ['GITHUB_SHA']]))
          print('REVIEW_CANDIDATE=' + commit['sha'])
          PY
