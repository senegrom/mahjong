name: prepare current Chii browser fixture
on:
  push:
    branches: [fix/review-repairs-20260910]
    paths: ['.github/workflows/branch-repair.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/fix/review-repairs-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Correct and verify the browser fixture
        run: |
          python - <<'PY'
          import pathlib, subprocess
          p = pathlib.Path('web/scripts/ui-regression.mjs')
          def blob():
              return subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          assert blob() == 'ba68cfbd24eecc1aa2763f61f66a2d298dcd6d5f'
          s = p.read_text()
          assert s.count('d.mask[73]?73:') == 1 and s.count('c.action===73') == 1
          p.write_text(s.replace('d.mask[73]?73:', 'd.mask[38]?38:').replace('c.action===73', 'c.action===38'))
          assert blob() == '83a8d47286f1a84b1231b5c753492bdd59d8d6ee'
          PY
          node --check web/scripts/ui-regression.mjs
          git diff --check
      - name: Create candidate commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'senegrom/mahjong'
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/review-repairs-20260910'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('diff', '--name-only') == 'web/scripts/ui-regression.mjs'
          def post(kind, payload):
              request = urllib.request.Request('https://api.github.com/repos/senegrom/mahjong/git/' + kind, data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method='POST')
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          entries = [dict(path='web/scripts/ui-regression.mjs', mode='100644', type='blob', content=pathlib.Path('web/scripts/ui-regression.mjs').read_text()), dict(path='.github/workflows/branch-repair.yml', mode='100644', type='blob', sha=None)]
          tree = post('trees', dict(base_tree=git('rev-parse', 'HEAD^{tree}'), tree=entries))
          commit = post('commits', dict(message='Use current Mortal Chii action in browser fault-injection regression', tree=tree['sha'], parents=[os.environ['GITHUB_SHA']]))
          print('REVIEW_CANDIDATE=' + commit['sha'])
          PY
