name: Import approved seven apples
on:
  push:
    branches: [art/van-gogh-seven-apples-corrected]
    paths: [.apples-transfer/ready.json]
permissions:
  contents: write
concurrency:
  group: import-van-gogh-seven-apples
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/art/van-gogh-seven-apples-corrected'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-seven-apples-corrected
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assemble exact approved painting and verify existing artwork
        run: python3 .apples-transfer/install.py
      - name: Install locked web test dependencies
        working-directory: web
        run: npm ci
      - name: Test tile faces and all artist regressions
        working-directory: web
        run: node --test tests/tile-faces.test.js tests/van-gogh-*.test.js tests/dali-*.test.js
      - name: Lint changed JavaScript
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs tests/tile-faces.test.js tests/van-gogh-seven-disks.test.js --max-warnings 0
      - name: Commit only verified apple integration
        run: |
          git rm -r .apples-transfer
          git add docs/design/van-gogh web/public/tiles/van-gogh web/src/lib/van-gogh-faces.js web/scripts/export-van-gogh-tiles.mjs web/tests/tile-faces.test.js web/tests/van-gogh-seven-disks.test.js
          python3 - <<'PY'
          import subprocess
          allowed = {
            'docs/design/van-gogh/README.md',
            'docs/design/van-gogh/seven-disks-apples.json',
            'docs/design/van-gogh/studies/23-seven-disks-apples-corrected-approved.svg',
            'web/public/tiles/van-gogh/README.md',
            'web/public/tiles/van-gogh/approved/Pin7.svg',
            'web/public/tiles/van-gogh/manifest.json',
            'web/public/tiles/van-gogh/preview.html',
            'web/src/lib/van-gogh-faces.js',
            'web/scripts/export-van-gogh-tiles.mjs',
            'web/tests/tile-faces.test.js',
            'web/tests/van-gogh-seven-disks.test.js',
          }
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert all(p in allowed or p.startswith('.apples-transfer/') for p in changed), changed
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add corrected Seven Apples for Van Gogh 7 disks in exact 3:4'
          git push origin HEAD:refs/heads/art/van-gogh-seven-apples-corrected
