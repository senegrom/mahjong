name: verify security fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/security-maintenance.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-maintenance
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Prepare scoped fixes
        shell: python
        run: |
          import json
          import re
          import subprocess
          from pathlib import Path

          expected = {
              '.github/workflows/ci.yml': 'a58d70986228a576af4b46a6aa6b87c77819804b',
              '.github/dependabot.yml': 'd698d8d008badb7f4a8abce0450da96ccdfb5e8b',
              'web/scripts/tile-effects-check.mjs': 'e1610c89e189de264526ebc7c5ddf1b93eb1ad1e',
              'web/package.json': '52fbd1a5969dff6a9d2857083c1aa46bf2de188d',
              'engine/riichi-py/Cargo.toml': 'b92789b93b3345fb48b175cf2aba205efb61d696',
              'engine/riichi-py/src/lib.rs': '348a96218424cd541d29b2d9b819bfa02bfe90b1',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Concurrent edit to {name}; refusing to overwrite {actual}')

          def write(name, content):
              path = Path(name)
              if path.exists() and name not in expected:
                  raise SystemExit(f'Refusing to overwrite new file {name}')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)

          write('.github/dependabot.yml', '''version: 2
          updates:
            - package-ecosystem: cargo
              directory: /
              schedule:
                interval: weekly
            - package-ecosystem: npm
              directory: /web
              schedule:
                interval: weekly
            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
          ''')

          write('web/eslint.config.js', '''import js from '@eslint/js';
          import globals from 'globals';

          export default [
            { ignores: ['node_modules/**', 'dist/**', 'public/**', 'src/wasm/**', 'test-results/**', '.tile-effects-*/**'] },
            {
              ...js.configs.recommended,
              files: ['**/*.{js,mjs}'],
              languageOptions: {
                ecmaVersion: 2022,
                sourceType: 'module',
                // Regression scripts also contain callbacks evaluated inside Chrome.
                globals: { ...globals.node, ...globals.browser },
              },
              rules: {
                ...js.configs.recommended.rules,
                'no-unused-vars': ['error', { argsIgnorePattern: '^_', varsIgnorePattern: '^_', caughtErrorsIgnorePattern: '^_' }],
              },
            },
          ];
          ''')

          write('web/scripts/static-fixture-server.mjs', '''/** Loopback-only HTTP handler for built test fixtures, not production. */
          import { readFile, realpath } from 'node:fs/promises';
          import { extname, resolve, sep } from 'node:path';

          const types = {
            '.html': 'text/html', '.js': 'text/javascript', '.mjs': 'text/javascript',
            '.css': 'text/css', '.svg': 'image/svg+xml', '.webp': 'image/webp',
            '.png': 'image/png', '.json': 'application/json', '.wasm': 'application/wasm',
          };

          export function createFixtureHandler({ root, publicRoot }) {
            return async (request, response) => {
              if (!['GET', 'HEAD'].includes(request.method)) {
                response.writeHead(405, { Allow: 'GET, HEAD' }).end();
                return;
              }
              let pathname;
              try {
                pathname = decodeURIComponent(new URL(request.url, 'http://localhost').pathname);
                if (pathname.includes('\\0')) throw new URIError('Invalid path');
              } catch {
                response.writeHead(400).end();
                return;
              }
              if (!pathname.startsWith('/mahjong/')) {
                response.writeHead(404).end();
                return;
              }
              const relative = pathname.slice('/mahjong/'.length) || 'index.html';
              const directory = resolve(relative.startsWith('tiles/') ? publicRoot : root);
              const file = resolve(directory, relative);
              if (!file.startsWith(directory + sep)) {
                response.writeHead(403).end();
                return;
              }
              try {
                const [actualRoot, actualFile] = await Promise.all([realpath(directory), realpath(file)]);
                if (!actualFile.startsWith(actualRoot + sep)) {
                  response.writeHead(403).end();
                  return;
                }
                // Read first: missing files must not become empty HTTP 200 responses.
                const body = await readFile(actualFile);
                response.writeHead(200, {
                  'Content-Type': types[extname(file)] ?? 'application/octet-stream',
                  'Content-Length': body.length,
                  'X-Content-Type-Options': 'nosniff',
                });
                response.end(request.method === 'HEAD' ? undefined : body);
              } catch (error) {
                const status = ['ENOENT', 'ENOTDIR', 'EISDIR'].includes(error.code) ? 404
                  : ['EACCES', 'EPERM'].includes(error.code) ? 403 : 500;
                response.writeHead(status).end();
              }
            };
          }
          ''')

          write('web/tests/static-fixture-server.test.js', '''import assert from 'node:assert/strict';
          import { test } from 'node:test';
          import { createServer, request } from 'node:http';
          import { mkdtemp, mkdir, writeFile, symlink, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { createFixtureHandler } from '../scripts/static-fixture-server.mjs';

          test('fixture server reports real HTTP statuses without exposing other files', async t => {
            const temp = await mkdtemp(join(tmpdir(), 'riichi-fixture-'));
            const root = join(temp, 'dist'), publicRoot = join(temp, 'public');
            await mkdir(root);
            await mkdir(join(publicRoot, 'tiles'), { recursive: true });
            await writeFile(join(root, 'index.html'), '<h1>Fixture</h1>');
            await writeFile(join(root, 'app.js'), 'export const ready = true;');
            await writeFile(join(publicRoot, 'tiles', 'Back.svg'), '<svg/>');
            await writeFile(join(temp, 'outside.txt'), 'not public');
            await symlink(join(temp, 'outside.txt'), join(root, 'escape.txt'));
            const server = createServer(createFixtureHandler({ root, publicRoot }));
            t.after(async () => {
              await new Promise((done, reject) => server.close(error => error ? reject(error) : done()));
              await rm(temp, { recursive: true, force: true });
            });
            await new Promise(done => server.listen(0, '127.0.0.1', done));
            const get = (path, method = 'GET') => new Promise((done, reject) => {
              const req = request({ host: '127.0.0.1', port: server.address().port, path, method }, res => {
                const chunks = [];
                res.on('data', chunk => chunks.push(chunk));
                res.on('end', () => done({ status: res.statusCode, body: Buffer.concat(chunks).toString(), headers: res.headers }));
                res.on('error', reject);
              });
              req.on('error', reject);
              req.end();
            });
            await t.test('serves index and JavaScript with their content types', async () => {
              const index = await get('/mahjong/');
              assert.equal(index.status, 200);
              assert.equal(index.body, '<h1>Fixture</h1>');
              assert.equal(index.headers['content-type'], 'text/html');
              const js = await get('/mahjong/app.js?v=1');
              assert.equal(js.status, 200);
              assert.equal(js.headers['content-type'], 'text/javascript');
            });
            await t.test('serves tile assets from the separate public root', async () => {
              const tile = await get('/mahjong/tiles/Back.svg');
              assert.equal(tile.status, 200);
              assert.equal(tile.body, '<svg/>');
            });
            await t.test('missing resources and paths outside the mount return 404', async () => {
              for (const path of ['/mahjong/missing.js', '/mahjong/app.js/child', '/elsewhere']) {
                const result = await get(path);
                assert.equal(result.status, 404, path);
                assert.equal(result.body, '');
              }
            });
            await t.test('malformed encoding and null bytes return 400', async () => {
              for (const path of ['/mahjong/%ZZ', '/mahjong/%E0%A4%A', '/mahjong/%00']) {
                assert.equal((await get(path)).status, 400, path);
              }
            });
            await t.test('encoded traversal and escaping symlinks return 403', async () => {
              for (const path of ['/mahjong/..%2Foutside.txt', '/mahjong/%2Fetc/passwd', '/mahjong/escape.txt', '/mahjong/tiles/..%2F..%2Foutside.txt']) {
                const result = await get(path);
                assert.equal(result.status, 403, path);
                assert.equal(result.body, '');
              }
            });
            await t.test('HEAD has headers but no body', async () => {
              const result = await get('/mahjong/', 'HEAD');
              assert.equal(result.status, 200);
              assert.equal(result.body, '');
              assert.equal(Number(result.headers['content-length']), Buffer.byteLength('<h1>Fixture</h1>'));
            });
            await t.test('unsupported methods return 405', async () => {
              const result = await get('/mahjong/', 'POST');
              assert.equal(result.status, 405);
              assert.equal(result.headers.allow, 'GET, HEAD');
            });
          });
          ''')

          path = Path('web/scripts/tile-effects-check.mjs')
          s = path.read_text()
          s = s.replace('import { mkdtemp, mkdir, readFile, writeFile, rm }', 'import { mkdtemp, mkdir, writeFile, rm }')
          s = s.replace('import { resolve, extname, sep }', 'import { resolve }')
          s = s.replace("import { createServer } from 'node:http';", "import { createServer } from 'node:http';\nimport { createFixtureHandler } from './static-fixture-server.mjs';")
          start = s.index('    const types = ')
          end = s.index('    await new Promise(done=>server.listen', start)
          s = s[:start] + "    server = createServer(createFixtureHandler({root:out,publicRoot:resolve(web,'public')}));\n" + s[end:]
          path.write_text(s)

          path = Path('web/package.json')
          pkg = json.loads(path.read_text())
          pkg['scripts']['check:play'] = pkg['scripts']['check']
          pkg['scripts']['check'] = 'svelte-check --no-tsconfig --fail-on-warnings'
          pkg['scripts']['lint'] = 'eslint . --max-warnings 0'
          pkg['scripts']['check:all'] = pkg['scripts']['check:all'].replace('npm run check &&', 'npm run lint && npm run check && npm run check:play &&', 1)
          path.write_text(json.dumps(pkg, indent=2) + '\n')

          path = Path('engine/riichi-py/Cargo.toml')
          path.write_text(path.read_text().replace('version = "0.23"', 'version = "0.29.2"'))
          path = Path('engine/riichi-py/src/lib.rs')
          s = path.read_text().replace('.allow_threads(', '.detach(').replace('Python::with_gil(', 'Python::attach(')
          s = re.sub(r'\bPyObject\b', 'Py<PyAny>', s)
          s = s.replace('#[pymodule]', '#[pymodule(gil_used = true)]')
          path.write_text(s)

          write('engine/riichi-py/smoke-test.py', '''"""Exercise the actual Python extension without training/NumPy dependencies."""
          import importlib.util
          from pathlib import Path

          root = Path(__file__).resolve().parents[2]
          spec = importlib.util.spec_from_file_location("riichi_py", root / "target/debug/libriichi_py.so")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          arena = module.Arena(games=2, seed=81)
          assert arena.games == 2
          assert len(arena.observations()) == 2 * module.PLANES * module.POSITIONS * 4
          assert len(arena.legal_mask()) == 2 * module.ACTIONS
          assert len(arena.seats()) == 2
          assert not arena.all_finished()
          snapshot = arena.observations()
          saved_hex = snapshot.hex()
          for _ in range(50):
              mask = arena.legal_mask()
              actions = [next(i for i, legal in enumerate(mask[g * module.ACTIONS:(g + 1) * module.ACTIONS]) if legal) for g in range(2)]
              arena.step(actions)
          assert len(arena.observations()) == len(snapshot)
          assert snapshot.hex() == saved_hex
          print("Python binding import, ABI, byte buffers and 100 game decisions passed")
          ''')

          path = Path('.github/workflows/ci.yml')
          s = path.read_text()
          s = s.replace('concurrency:\n', 'permissions:\n  contents: read\n\nconcurrency:\n', 1)
          pins = {
              'actions/checkout@v4': 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6',
              'dtolnay/rust-toolchain@stable': 'dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action',
              'Swatinem/rust-cache@v2': 'Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2',
              'actions/setup-node@v4': 'actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6',
              'actions/upload-artifact@v4': 'actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6',
              'actions/deploy-pages@v4': 'actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5',
          }
          for old, new in pins.items():
              s = s.replace(old, new)
          s = s.replace(' # v6\n      - uses: dtolnay/', ' # v6\n        with:\n          persist-credentials: false\n      - uses: dtolnay/')
          s = s.replace(' # stable action\n        with:\n', ' # stable action\n        with:\n          toolchain: 1.98.1\n')
          s = s.replace(' # v2.9.2\n', " # v2.9.2\n        with:\n          save-if: ${{ github.ref == 'refs/heads/main' }}\n")
          s = s.replace('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 20\n')
          s = s.replace('cargo clippy --workspace', 'cargo clippy --locked --workspace').replace('cargo test --workspace', 'cargo test --locked --workspace').replace('cargo build --release', 'cargo build --locked --release')
          s = s.replace('      - name: Fuzz the rules\n', '''      - name: Python binding smoke test
                  run: |
                    cargo build --locked -p riichi-py
                    python3 engine/riichi-py/smoke-test.py
                - name: Audit Rust dependencies
                  run: |
                    if ! command -v cargo-audit >/dev/null || [ "$(cargo-audit --version)" != "cargo-audit 0.22.2" ]; then
                      cargo install cargo-audit --version 0.22.2 --locked
                    fi
                    cargo audit
                - name: Fuzz the rules
          ''')
          s = s.replace('      - uses: jetli/wasm-pack-action@v0.4.0\n        with:\n          version: latest\n', '''      - name: Install pinned wasm-pack
                  run: |
                    if ! command -v wasm-pack >/dev/null || [ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]; then
                      cargo install wasm-pack --version 0.15.0 --locked
                    fi
          ''')
          s = s.replace('      - name: Build the engine for the browser\n', '''      - name: Audit web dependencies
                  working-directory: web
                  run: npm audit --audit-level=low
                - name: Build the engine for the browser
          ''')
          s = s.replace('      - name: Build the site\n', '''      - name: JavaScript lint and Svelte diagnostics
                  working-directory: web
                  run: |
                    npm run lint
                    npm run check
                - name: Build the site
          ''')
          s = s.replace("      - uses: actions/upload-pages-artifact@v3\n        if: github.ref == 'refs/heads/main'\n        with:\n          path: web/dist\n", '''      # The upstream Pages wrapper still embeds a Node 20 upload action.
                # Preserve its tar format and use the pinned Node 24 uploader directly.
                - name: Package Pages artifact
                  if: github.ref == 'refs/heads/main'
                  run: |
                    tar --dereference --hard-dereference --directory web/dist --exclude=.git --exclude=.github --exclude='.[^/]*' -cf "$RUNNER_TEMP/artifact.tar" .
                - name: Upload Pages artifact
                  if: github.ref == 'refs/heads/main'
                  uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
                  with:
                    name: github-pages
                    path: ${{ runner.temp }}/artifact.tar
                    retention-days: 1
                    if-no-files-found: error
                    compression-level: 0
          ''')
          path.write_text(s)
          print('Prepared guarded security fixes; no application changes published yet')
      - name: Resolve locked dependencies
        run: |
          cargo update -p pyo3 --precise 0.29.2
          npm --prefix web install --save-dev --save-exact eslint@9 @eslint/js@9 globals@16 svelte-check@4 typescript@5
          cargo fmt --all
      - name: Rust verification
        id: rust
        continue-on-error: true
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked -p riichi-py
          python3 engine/riichi-py/smoke-test.py
          cargo build --locked --release -p riichi-cli
          ./target/release/riichi-cli fuzz --games 500 --seed 81
          ./target/release/riichi-cli arena --games 20 --seed 1
      - name: Browser build tools
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          npm --prefix web run wasm
      - name: Static verification
        id: static
        continue-on-error: true
        working-directory: web
        run: |
          npm run lint
          npm run check
      - name: Web verification
        id: web
        continue-on-error: true
        working-directory: web
        run: |
          npm run build
          npm run test:unit
          npm run test:browser
          node scripts/check-icons.mjs
          node scripts/check-icons.mjs --built
      - name: Dependency security verification
        id: audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          npm --prefix web audit --audit-level=low
      - name: Publish only when every verification succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_OUTCOME: ${{ steps.rust.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          test "$RUST_OUTCOME" = success
          test "$STATIC_OUTCOME" = success
          test "$WEB_OUTCOME" = success
          test "$AUDIT_OUTCOME" = success
          git diff --check
          git add .github/workflows/ci.yml .github/dependabot.yml Cargo.lock engine/riichi-py web/package.json web/package-lock.json web/eslint.config.js web/scripts web/tests web/src
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix security configuration, PyO3 advisories, frontend checks and fixture HTTP errors'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
