name: verify security fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/security-maintenance.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-maintenance
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == 'senegrom'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Prepare the previously validated source changes
        shell: python
        run: |
          import subprocess
          import sys
          import tempfile
          import textwrap
          from pathlib import Path

          # Read the immutable recipe as data at runtime: future CI expressions
          # must not be interpolated using this one-off run's context.
          workflow = subprocess.check_output([
              'git', 'show',
              '37dfa26557ec672a07639d90f5f0e5d831f3063c:.github/workflows/security-maintenance.yml',
          ], text=True)
          section = workflow.split('      - name: Prepare scoped fixes\n', 1)[1].split('      - name: Resolve locked dependencies\n', 1)[0]
          recipe = textwrap.dedent(section.split('        run: |\n', 1)[1])
          with tempfile.TemporaryDirectory() as directory:
              script = Path(directory) / 'prepare.py'
              script.write_text(recipe)
              subprocess.run([sys.executable, str(script)], check=True)
          # The connected account publishes workflow edits separately; the
          # Actions installation token is intentionally not used for that.
          subprocess.run(['git', 'restore', '.github/workflows/ci.yml'], check=True)
          path = Path('engine/riichi-py/Cargo.toml')
          source = path.read_text()
          assert 'rust-version.workspace = true' in source
          path.write_text(source.replace('rust-version.workspace = true', 'rust-version = "1.83"'))
      - name: Resolve dependencies and check source
        run: |
          cargo update -p pyo3 --precise 0.29.2
          npm --prefix web install --save-dev --save-exact eslint@10 @eslint/js@10 globals@16 svelte-check@4 typescript@5
          cargo fmt --all
          npm --prefix web run lint
          npm --prefix web audit --audit-level=low
          node --test web/tests/static-fixture-server.test.js
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked -p riichi-py
          python3 engine/riichi-py/smoke-test.py
          git diff --check
      - name: Preserve the reviewed patch
        if: always()
        run: |
          mkdir -p security-evidence
          git diff --binary > security-evidence/tracked-changes.patch
          git status --short > security-evidence/status.txt
          cp web/package-lock.json security-evidence/package-lock.json
          cp Cargo.lock security-evidence/Cargo.lock
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: security-fix-evidence
          path: security-evidence
          retention-days: 7
      - name: Publish validated source changes without workflow edits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .github/dependabot.yml Cargo.lock engine/riichi-py web/package.json web/package-lock.json web/eslint.config.js web/scripts web/tests web/src
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow files must be published through the connected account.' >&2
            exit 1
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix PyO3 security advisories, dependency updates, frontend gates and fixture HTTP errors'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
