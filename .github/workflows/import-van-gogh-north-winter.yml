name: Prepare approved winter North wind
on:
  push:
    branches: [art/van-gogh-north-winter-20261019]
    paths: ['.github/workflows/import-van-gogh-north-winter.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-north-winter-20261019
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Import winter B, archive North ribbons and verify all other art
        run: python3 .winter-upload/prepare.py
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci
      - name: Test artist faces, original proportions and isolated exports
        working-directory: web
        run: |
          node --test --test-reporter=spec tests/tile-faces.test.js tests/tile-proportions.test.js tests/van-gogh-*.test.js tests/dali*.test.js > "$RUNNER_TEMP/winter-art-tests.txt" 2>&1 || { cat "$RUNNER_TEMP/winter-art-tests.txt"; exit 1; }
          tail -12 "$RUNNER_TEMP/winter-art-tests.txt"
          npm run lint
      - name: Save only the approved winter replacement
        run: |
          git rm -r .winter-upload
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-north-winter.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace Van Gogh North ribbons with approved Snowbound North B'
          git push origin HEAD:refs/heads/art/van-gogh-north-winter-20261019
      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: north-winter-validation
          path: |
            ${{ runner.temp }}/winter-import-report.json
            ${{ runner.temp }}/winter-art-tests.txt
          if-no-files-found: ignore
          retention-days: 7
