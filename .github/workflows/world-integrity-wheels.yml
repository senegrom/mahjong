name: world integrity wheels
on:
  push:
    branches: [validation/world-integrity-wheels-20260915]
    paths: [.github/workflows/world-integrity-wheels.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2bb2a8875115cc89b04ed083828199c660590d73
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: false
      - name: Build engines and native test binaries
        run: |
          python -m pip install 'maturin>=1.7,<2'
          (cd engine/riichi-py && maturin build --release --locked --out ../../wheels)
          (cd engine/libriichi && maturin build --release --locked --out ../../wheels)
          cargo test --locked --release -p riichi-core --no-run
          git rev-parse HEAD > wheels/source-commit.txt
          find target/release/deps -maxdepth 1 -type f -executable \( -name 'riichi_core-*' -o -name 'riichi_worlds-*' \) -exec cp {} wheels/ \;
      - name: Time the joint declaration stress case
        run: timeout 40s cargo test --locked --release -p riichi-core three_declared_hands -- --nocapture > wheels/joint-stress.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-world-integrity-wheels
          path: wheels/
          retention-days: 2
