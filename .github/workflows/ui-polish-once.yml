name: verify full gameplay UI polish

on:
  push:
    branches: [main]
    paths: [.github/workflows/ui-polish-once.yml]

permissions:
  contents: write

concurrency:
  group: ui-polish-once
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install pinned wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null || [ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply scoped UI changes
        run: |
          python3 .ui-polish/application.py
          python3 .ui-polish/fix-warnings.py
          python3 .ui-polish/fix-overflow.py
          # Opens the real Options disclosure before toggling Hints in the visual regression.
          python3 .ui-polish/fix-test-race.py

      - name: Build and verify every web path
        working-directory: web
        run: |
          set -euxo pipefail
          npm ci
          npm run wasm
          npm run lint
          npm run check
          npm run build
          npm run test:unit 2>&1 | tee /tmp/ui-unit.txt
          npm run test:browser 2>&1 | tee /tmp/ui-browser.txt
          node scripts/check-icons.mjs
          node scripts/check-icons.mjs --built

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit exact tested UI directly to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          original=$(git rev-parse HEAD)
          git rm .github/workflows/ui-polish-once.yml .ui-polish/application.py .ui-polish/fix-warnings.py .ui-polish/fix-overflow.py .ui-polish/fix-test-race.py
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Polish the table, mobile chrome, calls, results and tile hints'
          git fetch origin main
          remote=$(git rev-parse origin/main)
          if [ "$remote" != "$original" ]; then
            if ! git diff --quiet "$original" "$remote" -- README.md web; then
              echo 'Concurrent UI/application changes detected; refusing to overwrite them.' >&2
              exit 1
            fi
            git rebase origin/main
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          git rev-parse HEAD | tee /tmp/ui-commit.txt

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-ui-polish-verification
          path: |
            /tmp/ui-unit.txt
            /tmp/ui-browser.txt
            /tmp/ui-commit.txt
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
