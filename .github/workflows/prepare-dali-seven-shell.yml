name: Prepare approved Dali seven-pearl shell
on:
  push:
    branches:
      - design/dali-seven-disks-shell-a-20261019
permissions:
  contents: write
concurrency:
  group: prepare-dali-seven-shell
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/dali-seven-disks-shell-a-20261019
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Import selected shell A and verify every previous artwork
        run: python3 .dali-seven-disks-transfer/prepare.py
      - name: Update prior coverage snapshots for the new twenty-fourth tile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names = ('dali-east-wind.test.js', 'dali-four-disks.test.js', 'dali-north-wind.test.js', 'dali-six-bamboo.test.js', 'dali-two-disks.test.js')
          replacements = (
              ('assert.equal(set.tiles.length, 23);', 'assert.equal(set.tiles.length, 24);'),
              ('assert.equal(set.placeholders.length, 11);', 'assert.equal(set.placeholders.length, 10);'),
              ('23 approved faces', '24 approved faces'),
              ('remaining 11 tiles', 'remaining 10 tiles'),
          )
          prepared = {}
          for name in names:
              target = Path('web/tests') / name
              text = target.read_text()
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise ValueError(f'Coverage snapshot changed in {name}: {old}')
                  text = text.replace(old, new, 1)
              if name == 'dali-two-disks.test.js':
                  old = 'the twenty-three-face preview'
                  assert text.count(old) == 1
                  text = text.replace(old, 'the twenty-four-face preview', 1)
              prepared[target] = text
          for target, text in prepared.items():
              target.write_text(text, encoding='utf-8')
          print('Updated five existing coverage snapshots; all artwork and behavior assertions retained.')
          PY
      - name: Lint changed JavaScript
        working-directory: web
        run: npx eslint scripts/export-dali-tiles.mjs src/lib/dali-faces.js tests/dali-*.test.js tests/tile-faces.test.js --max-warnings 0
      - name: Tile, artist, proportion and offline regression tests
        working-directory: web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          tests = sorted(str(p) for p in Path('tests').glob('*.test.js') if any(k in p.name for k in ('tile', 'van-gogh', 'dali', 'matisse', 'face-fit', 'proportion', 'offline')))
          print('Running:', *tests, flush=True)
          subprocess.run(['node', '--test', *tests], check=True)
          PY
      - name: Commit verified tile and remove one-time preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/dali/README.md docs/design/dali/seven-disks.json docs/design/dali/studies/seven-disks-a-shell-approved.svg docs/design/dali/studies/seven-disks-a-shell-hires.avif web/public/tiles/dali/approved/Pin7.svg web/public/tiles/dali/manifest.json web/public/tiles/dali/preview.html web/src/lib/dali-faces.js web/scripts/export-dali-tiles.mjs web/tests/dali-seven-disks.test.js web/tests/dali-six-disks.test.js web/tests/dali-bamboo.test.js web/tests/tile-faces.test.js web/tests/dali-east-wind.test.js web/tests/dali-four-disks.test.js web/tests/dali-north-wind.test.js web/tests/dali-six-bamboo.test.js web/tests/dali-two-disks.test.js
          git rm -r .dali-seven-disks-transfer .github/workflows/prepare-dali-seven-shell.yml
          git diff --cached --check
          git commit -m 'Install approved seven-pearl shell A as Dali 7 disks; preserve all other art'
          git push origin HEAD:design/dali-seven-disks-shell-a-20261019
