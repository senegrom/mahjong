name: prepare training integrity fixes
on:
  push:
    branches: [fix/training-integrity-20260911]
    paths: [.github/workflows/prepare-integrity-fixes.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/fix/training-integrity-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply locally tested and hash-verified fixes
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = '''
          
          
          '''
          # Correct two transcription duplications before decoding; the digest
          # below remains the authority for every byte of the reviewed patch.
          encoded = ''.join(encoded.split()).replace('OaeaxEaxEoLIw', 'OaeaxEoLIw').replace('ZSBGGpy9VD', 'ZSBGpy9VD')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '05a9d140f277286ba5c72ea7fec677fbf62558fb4aaf2425f94293c8b622930f'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == 'ff55c8749d02593f458fb678e6dbee6b7f8b42ed'
          path = pathlib.Path('/tmp/training-integrity.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          expected = {
            'docs/TRAINING_CORRECTNESS.md': '43292ffbbf04dfb6a0224f9cc749255af2aab8f1',
            'neural/arena.py': 'ccf94012758be693ef405d238acc226a580407dd',
            'neural/duel.py': 'e8e94fec5a255f6ea87e9240be15b67995568c38',
            'neural/outcomes.py': 'd5e41ef3217b402bdaa0fef87c4ee871b4c6c2d0',
            'neural/replay.py': '406bf16b4bcf7ed1f16f426e46b321d588aaee11',
            'neural/searched.py': '8e2dc2aa5fb66cb40221679a7c3f7e96f314fb23',
            'neural/selfplay.py': 'd694671aafff6fa45e3d02c0eba59e60a34990ca',
            'neural/tests/test_outcomes.py': '2c00b1093d7a20cb2084b5b3b4da6658ddc1edd8',
            'neural/tests/test_replay_atomic.py': 'd7f0f9d05e72dd2bdcd735514275c6d006a4568f',
            'neural/tests/test_selfplay_accounting.py': '2045cc8477262a9ad6f0a7213b0c24cc761b4f90',
            'web/scripts/adviser-review-check.mjs': '5e00b2852c16e82a8c2fdf86f5033145bd136859',
            'web/src/lib/agents.js': '4679ad6712b2b98af697ab4208720f8798990795',
            'web/src/lib/policy-weights.js': '96a629a99fcd6259a017eb3e55b20929c1564814',
            'web/src/lib/review-policy.js': '1446413d6ee78076d09da390bfc29273af21f5fb',
            'web/tests/policy-weights.test.js': '4bfbb8c3582d28396463b1e7b9ac3c7d10b2a179',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == sha, (name, actual, sha)
              if name.endswith(('.js', '.mjs')):
                  subprocess.run(['node', '--check', name], check=True)
          subprocess.run(['python', '-m', 'compileall', '-q', 'neural'], check=True)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/prepare-integrity-fixes.yml'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected) | {'.github/workflows/prepare-integrity-fixes.yml'}
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Commit only to the requested repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = senegrom/mahjong
          test "$GITHUB_REF" = refs/heads/fix/training-integrity-20260911
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix training settlement, tie outcomes, truncation, atomic replay and policy aliases'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/fix/training-integrity-20260911
          echo "Repair commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
