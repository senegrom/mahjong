name: apply review repair
on:
  push:
    branches: [fix/review-20260917]
    paths: [.review-patch-2.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify base and patch, apply once, remove transfer files
        run: |
          git merge-base --is-ancestor 0467d90d0dadb725f29e9c2407c63247f22a565b HEAD
          git diff --exit-code 0467d90d0dadb725f29e9c2407c63247f22a565b HEAD -- . ':!.github/workflows/apply-review.yml' ':!.review-patch-1.b64' ':!.review-patch-2.b64'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.review-patch-{part}.b64').read_text().strip() for part in (1, 2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4bef4ce169c5979d12ecaf538f0e289e5f80ddcb6589aed2b43ca08e8c40b5b4'
          Path('/tmp/review.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero /tmp/review.patch
          git apply --index --unidiff-zero /tmp/review.patch
          git rm .review-patch-1.b64 .review-patch-2.b64 .github/workflows/apply-review.yml
          git diff --cached --check
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git commit -m 'Fix placement artifacts, verified offline model delivery and yaku attribution'
          git push origin HEAD:refs/heads/fix/review-20260917
