name: teacher regression dependencies
on:
  push:
    branches: [learning/teacher-repairs-20260915]
    paths: [.github/workflows/teacher-test-deps.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Collect public dependencies
        run: |
          mkdir -p dependencies/wheels dependencies/bin
          python -m pip download 'onnx>=1.17,<2' 'onnxruntime>=1.22,<2' -d dependencies/wheels
          cp "$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu/bin/cargo-clippy" dependencies/bin/
          cp "$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu/bin/clippy-driver" dependencies/bin/
          tar -czf teacher-dependencies.tar.gz dependencies
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teacher-test-dependencies
          path: teacher-dependencies.tar.gz
          retention-days: 1
