name: Prepare approved Van Gogh seven bamboo
on:
  push:
    branches: [asset/van-gogh-7s-irises-c-20260929]
    paths: [.van-gogh-7s-import/ready]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: asset/van-gogh-7s-irises-c-20260929
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install image export dependency
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick
      - name: Assemble and register exact selected C artwork
        run: python3 .van-gogh-7s-import/prepare.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test tile assets and registration
        working-directory: web
        run: node --test tests/tile-faces.test.js
      - name: Lint changed JavaScript
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs tests/tile-faces.test.js --max-warnings 0
      - name: Remove temporary import files and publish tested asset changes
        run: |
          rm -rf .van-gogh-7s-import .github/workflows/prepare-van-gogh-7s.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Export approved Seven with Irises C for Van Gogh 7 bamboo'
          git push origin HEAD:asset/van-gogh-7s-irises-c-20260929
