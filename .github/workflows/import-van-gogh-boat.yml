name: Prepare approved Van Gogh red sail
on:
  push:
    branches: [art/van-gogh-one-red-sail-20261015]
    paths: [.github/workflows/import-van-gogh-boat.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: art/van-gogh-one-red-sail-20261015
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Import only the approved boat and preserve every other image
        run: |
          python3 .boat-upload/prepare.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/scripts/export-van-gogh-tiles.mjs')
          s = p.read_text()
          old = "const featured = ['1m', '9m', '8m', '4p', '7m', '6m', '5m', '2m', '3m', '9p', '3p', '9s', '6s', '8s'];"
          new = "const featured = ['9m', '8m', '4p', '7m', '6m', '5m', '2m', '3m', '4m', '9p', '3p', '9s', '6s', '8s'];"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          p = Path('web/tests/van-gogh-one-red-sail.test.js')
          s = p.read_text().replace('the red sail appears in the gallery and in the fourteen-tile example hand', 'the red sail appears in the gallery without extending the fourteen-tile example hand')
          old = "  assert.equal((rack.match(/approved\\/Man1\\.svg/g) ?? []).length, 1);"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "  assert.match(html, /<img src=\"approved\\/Man1\\.svg\" alt=\"One character\"/);"))
          PY
          node web/scripts/export-van-gogh-tiles.mjs --only=1m
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci
      - name: Run all artist regressions, proportion tests and lint
        working-directory: web
        run: |
          node --test tests/tile-faces.test.js tests/tile-proportions.test.js tests/van-gogh-*.test.js tests/dali*.test.js > "$RUNNER_TEMP/boat-art-tests.txt" 2>&1 || { grep -n -B 2 -A 45 '^not ok' "$RUNNER_TEMP/boat-art-tests.txt"; tail -14 "$RUNNER_TEMP/boat-art-tests.txt"; exit 1; }
          tail -14 "$RUNNER_TEMP/boat-art-tests.txt"
          npm run lint
      - name: Save only the requested art changes on this branch
        run: |
          git rm -r .boat-upload
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-one-red-sail.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deploy approved Red Sail C as Van Gogh 1 character; complete all numbered suits'
          git push origin HEAD:refs/heads/art/van-gogh-one-red-sail-20261015
      - name: Upload focused validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: red-sail-validation
          path: ${{ runner.temp }}/boat-art-tests.txt
          if-no-files-found: ignore
          retention-days: 7
