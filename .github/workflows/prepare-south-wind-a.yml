name: Prepare approved South wind A

on:
  push:
    branches: [design/van-gogh-south-wind-a-20261018]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/van-gogh-south-wind-a-20261018
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Import selected courtyard A and verify all prior artwork
        run: python3 .south-wind-A-transfer/prepare.py
      - name: Lint changed JavaScript
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/tile-proportions.test.js tests/van-gogh-south-wind.test.js --max-warnings 0
      - name: Tile, artist, proportions and offline regressions
        working-directory: web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          tests = sorted(str(p) for p in Path('tests').glob('*.test.js') if any(k in p.name for k in ('tile', 'van-gogh', 'dali', 'matisse', 'face-fit', 'proportion', 'offline')))
          print('Running:', *tests, flush=True)
          subprocess.run(['node', '--test', *tests], check=True)
          PY
      - name: Commit verified South wind and remove temporary preparation
        run: |
          git rm -r .south-wind-A-transfer
          git rm .github/workflows/prepare-south-wind-a.yml
          git add docs/design/van-gogh/README.md docs/design/van-gogh/south-wind-billowing-courtyard-a.json docs/design/van-gogh/studies/27-south-wind-billowing-courtyard-a-approved.svg web/public/tiles/van-gogh/README.md web/public/tiles/van-gogh/approved/Nan.svg web/public/tiles/van-gogh/manifest.json web/public/tiles/van-gogh/preview.html web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/tile-proportions.test.js web/tests/van-gogh-south-wind.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deploy approved Billowing Courtyard A as Van Gogh South wind; preserve all prior artwork'
          git push origin HEAD:refs/heads/design/van-gogh-south-wind-a-20261018
