name: Prepare approved eight lemons
on:
  push:
    branches: [design/van-gogh-eight-lemons-20261011]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/van-gogh-eight-lemons-20261011
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Import approved eight lemons and verify all existing artwork
        run: python3 .van-gogh-eight-lemons-transfer/prepare.py
      - name: Lint changed JavaScript
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/van-gogh-eight-disks.test.js --max-warnings 0
      - name: Tile, artist, proportion and offline regressions
        working-directory: web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          tests = sorted(str(p) for p in Path('tests').glob('*.test.js') if any(k in p.name for k in ('tile', 'van-gogh', 'dali', 'matisse', 'face-fit', 'proportion', 'offline')))
          print('Running:', *tests, flush=True)
          subprocess.run(['node', '--test', *tests], check=True)
          PY
      - name: Commit verified tile and remove one-time transport
        run: |
          rm -r .van-gogh-eight-lemons-transfer
          rm .github/workflows/prepare-eight-lemons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-eight-disks.test.js .van-gogh-eight-lemons-transfer .github/workflows/prepare-eight-lemons.yml
          git diff --cached --check
          git commit -m 'feat(tiles): deploy eight lemons as Van Gogh 8 disks'
          git push origin "HEAD:${GITHUB_REF_NAME}"
