name: Prepare approved Four Bamboo Sunlit Garden B
on:
  push:
    branches: [art/prepare-van-gogh-four-garden-20261029]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: 9e5a0da551752cf37462a343f5182ba2192dda24
      TARGET_BRANCH: art/van-gogh-four-bamboo-sunlit-garden-b-20261029
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install selected garden and archive only its predecessor
        run: python3 .garden-prep/install.py
      - name: Install existing locked dependencies
        working-directory: web
        run: npm ci
      - name: Validate tile integration and proportions
        working-directory: web
        run: node --test tests/van-gogh*.test.js tests/tile-faces.test.js tests/tile-proportions.test.js
      - name: Lint changed code
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs tests/tile-faces.test.js tests/tile-proportions.test.js tests/van-gogh-four-garden.test.js --max-warnings 0
      - name: Verify preservation and publish clean artwork-only branch
        run: python3 .garden-prep/publish.py
