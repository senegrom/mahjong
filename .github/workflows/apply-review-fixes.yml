name: apply full review repairs
on:
  push:
    branches: [fix/full-review-20260916]
    paths: [.github/workflows/apply-review-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Apply exact locally validated patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.review-fixes-{n}.b64').read_text().strip() for n in (1, 2, 3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = 'cd2e873d6e8ba34a5bb1f98aedfe0cde4eaa8ed03a2981e51f4b1ecd7b403877'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Refusing patch with a different digest')
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .review-fixes-{1,2,3}.b64 .github/workflows/review-workspace.yml .github/workflows/apply-review-fixes.yml
          cargo fmt --all --check
          python -m compileall -q neural
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix full-review boundaries: complete claim matching, fresh chance, reader metadata and bound rankers'
          git fetch origin main
          git merge --no-edit origin/main
          cargo fmt --all --check
          git push origin HEAD:refs/heads/fix/full-review-20260916
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git diff --stat origin/main...HEAD >> "$GITHUB_STEP_SUMMARY"
