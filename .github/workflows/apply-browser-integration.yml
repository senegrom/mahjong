name: apply browser integration repair
on:
  push:
    branches: [fix/review-20260917]
    paths: [.review-integration.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and apply integration patch, remove transfer files
        run: |
          git merge-base --is-ancestor ef44b0c8f3d1a857194fde35f356707a7e1613b2 HEAD
          git diff --exit-code ef44b0c8f3d1a857194fde35f356707a7e1613b2 HEAD -- . ':!.github/workflows/apply-browser-integration.yml' ':!.review-integration.b64'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(base64.b64decode(Path('.review-integration.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ba1f84e828150b988dce5934f5ea44cdbc5150dae1a09e2e186115a754e64fba'
          Path('/tmp/integration.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero /tmp/integration.patch
          git apply --index --unidiff-zero /tmp/integration.patch
          git rm .review-integration.b64 .github/workflows/apply-browser-integration.yml
          git diff --cached --check
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git commit -m 'Preserve scored saves and observe service-worker model downloads in browser checks'
          git push origin HEAD:refs/heads/fix/review-20260917
