name: teacher review snapshot

on:
  push:
    branches: [learning/teacher-repairs-20260915]
    paths: [.github/workflows/teacher-review-snapshot.yml]
  pull_request:
    paths: [.github/workflows/teacher-review-snapshot.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package the exact training source tree
        run: |
          git rev-parse HEAD > teacher-source-revision.txt
          tar -czf teacher-source.tar.gz neural engine Cargo.toml Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teacher-source
          path: |
            teacher-source.tar.gz
            teacher-source-revision.txt
          retention-days: 1
