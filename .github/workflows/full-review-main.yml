name: Verify and apply reviewed fixes on main

on:
  push:
    branches: [main]
    paths:
      - '.review-full/**'
      - '.github/workflows/full-review-main.yml'

permissions:
  contents: write

concurrency:
  group: full-review-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply hash-verified reviewed changes
        run: |
          python3 .review-full/apply.py
          cargo fmt --all
      - name: Check engine and exported event accounting
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Install and build browser engine
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
      - name: Session, saved-match and real-engine regressions
        working-directory: web
        run: npm run test:unit
      - name: Browser, keyboard, ura-dora and final-hand regressions
        working-directory: web
        run: npm run test:browser
      - name: Validate installation icons
        working-directory: web
        run: |
          node scripts/check-icons.mjs
          node scripts/check-icons.mjs --built
      - name: Commit verified application files to main and remove one-time transfer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine web
          git rm -r .review-full .github/workflows/full-review-main.yml
          git commit -m 'Fix waits, keyboard play, final-hand review and MJAI exports; reveal ura-dora'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/full-review-commit.txt
      - name: Package tested source and browser evidence
        if: always()
        run: |
          tar --exclude='web/node_modules' --exclude='web/public/ort' -czf /tmp/full-review-workspace.tar.gz engine web docs Cargo.toml Cargo.lock .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-review-workspace
          path: |
            /tmp/full-review-workspace.tar.gz
            /tmp/full-review-commit.txt
          retention-days: 2
          if-no-files-found: error
