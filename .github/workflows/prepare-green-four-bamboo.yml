name: Prepare approved green Moonlit Four

on:
  push:
    branches: [design/van-gogh-green-four-bamboo-20260928]

permissions:
  contents: write

concurrency:
  group: prepare-green-four-bamboo
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/design/van-gogh-green-four-bamboo-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Image export prerequisites
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Integrate only approved green Moonlit Four
        run: python3 .sou4-transfer/install.py
      - name: Lint and tile regressions
        working-directory: web
        run: npm run lint && node --test tests/tile-faces.test.js tests/offline.test.js
      - name: Commit finished assets and remove temporary transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf -- .sou4-transfer
          rm -- .github/workflows/prepare-green-four-bamboo.yml
          git add -A -- .sou4-transfer .github/workflows/prepare-green-four-bamboo.yml docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tiles): add approved green Moonlit Four as Van Gogh 4 bamboo'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/design/van-gogh-green-four-bamboo-20260928
