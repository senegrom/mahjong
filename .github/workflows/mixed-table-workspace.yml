name: mixed table workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/mixed-table-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Package source and test dependencies (no credentials)
        run: |
          git rev-parse HEAD > /tmp/mixed-base.txt
          git ls-files -z | tar --null -T - -czf /tmp/mixed-source.tar.gz
          tar -czf /tmp/mixed-node-modules.tar.gz web/node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mixed-workspace
          path: |
            /tmp/mixed-base.txt
            /tmp/mixed-source.tar.gz
            /tmp/mixed-node-modules.tar.gz
          retention-days: 2
