name: mixed table workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/mixed-table-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Package source and test dependencies (no credentials)
        run: |
          git rev-parse HEAD > /tmp/mixed-base.txt
          git ls-files -z | tar --null -T - -czf /tmp/mixed-source.tar.gz
          tar -czf /tmp/mixed-node-modules.tar.gz web/node_modules
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mixed-workspace
          path: |
            /tmp/mixed-base.txt
            /tmp/mixed-source.tar.gz
            /tmp/mixed-node-modules.tar.gz
          retention-days: 2
