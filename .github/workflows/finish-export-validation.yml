name: finish export validation
on:
  push:
    branches: [fix/full-review-20260916]
    paths: [.github/workflows/finish-export-validation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preserve fused masks while rejecting invalid logits on either side
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('neural/export.py')
          expected = '52792b007444aaa409acaf3a8dd559dab6972aaf'
          if subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() != expected:
              raise SystemExit('Exporter changed; refusing an unreviewed replacement')
          old = '''                # A fusion answers negative infinity for a move the rules
                          # forbid. The two must refuse exactly the same moves, and
                          # every move they do answer must be a number.
                          if not torch.equal(torch.isfinite(ours), torch.isfinite(theirs)):
                              raise SystemExit("The exported policy answers a different set of moves")
                          if not torch.isfinite(ours[allowed]).all():
                              raise SystemExit("Non-finite reference policy on a legal move")'''
          new = '''                # Only negative infinity on an illegal move is a mask sentinel.
                          # Check each side first: matching NaN/+inf is never a valid mask,
                          # and a corrupt legal logit must name the side that produced it.
                          for side, logits in (("reference", ours), ("exported", theirs)):
                              valid = torch.isfinite(logits) | (torch.isneginf(logits) & ~allowed)
                              if not valid.all():
                                  raise SystemExit(f"Non-finite {side} policy output outside masked moves")
                          if not torch.equal(torch.isfinite(ours), torch.isfinite(theirs)):
                              raise SystemExit("The exported policy answers a different set of moves")'''
          source = path.read_text()
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
          python -m compileall -q neural
          git rm .github/workflows/finish-export-validation.yml
          git add neural/export.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate each export policy before comparing finite masks'
          git push origin HEAD:refs/heads/fix/full-review-20260916
