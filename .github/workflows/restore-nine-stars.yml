name: Restore original Van Gogh Nine Stars
on:
  push:
    branches: [design/restore-nine-stars-20261006]
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/design/restore-nine-stars-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/restore-nine-stars-20261006
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Restore exact original and verify all other artwork unchanged
        run: python3 .nine-stars-restore/prepare.py
      - name: Lint changed JavaScript
        working-directory: web
        run: npx --no-install eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/van-gogh-nine-disks.test.js --max-warnings 0
      - name: Tile, preservation and offline regression tests
        working-directory: web
        run: node --test tests/tile-faces.test.js tests/van-gogh-*.test.js tests/offline.test.js
      - name: Commit verified restoration and remove one-time preparation files
        run: |
          rm -rf .nine-stars-restore
          rm .github/workflows/restore-nine-stars.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/van-gogh web/public/tiles/van-gogh web/scripts/export-van-gogh-tiles.mjs web/src/lib/van-gogh-faces.js web/tests/tile-faces.test.js web/tests/van-gogh-nine-disks.test.js .nine-stars-restore .github/workflows/restore-nine-stars.yml
          git diff --cached --check
          git commit -m 'Restore original Nine Stars as Van Gogh 9 disks; preserve Potter’s Table'
          git push origin "HEAD:${GITHUB_REF_NAME}"
