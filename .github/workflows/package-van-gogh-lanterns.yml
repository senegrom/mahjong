name: Package approved Van Gogh lanterns

on:
  push:
    branches: [art/van-gogh-three-lanterns-b]
    paths: [.art-staging/three-lanterns/ready]

permissions:
  contents: write

jobs:
  package:
    if: github.repository == 'senegrom/mahjong' && github.ref == 'refs/heads/art/van-gogh-three-lanterns-b'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Assemble and verify the selected artwork
        run: python3 .art-staging/three-lanterns/package.py
      - name: Verify tile integration
        working-directory: web
        run: |
          npm ci
          node --test tests/tile-faces.test.js tests/van-gogh-three-lanterns.test.js
          npx eslint scripts/export-van-gogh-tiles.mjs tests/tile-faces.test.js tests/van-gogh-three-lanterns.test.js --max-warnings 0
      - name: Upload verified Git blobs, without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .art-staging/three-lanterns/upload.py
