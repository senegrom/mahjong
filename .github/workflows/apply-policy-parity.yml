name: apply guarded policy parity patch
on:
  push:
    branches: [fix/policy-search-parity-20260917]
    paths:
      - .github/workflows/apply-policy-parity.yml
      - .review/apply-policy-parity.py
      - .review/finalize-policy-parity.py
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/policy-search-parity-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/policy-search-parity-20260917
          persist-credentials: true
      - name: Require the reviewed source before editing
        run: |
          git fetch --no-tags --depth=1 origin 5106125ff2f95214be537e8ee520ef99d9fcf861
          git diff --exit-code 5106125ff2f95214be537e8ee520ef99d9fcf861 HEAD -- neural/contract.py neural/combined.py neural/zoo.py neural/searched.py neural/teacher_options.py neural/collect_search.py neural/search_replay.py neural/train_search.py neural/modal_app.py web/tests/runtime-memory.test.js .github/workflows/neural.yml
      - name: Apply exact-context edits and validate syntax
        run: |
          python .review/apply-policy-parity.py
          python .review/finalize-policy-parity.py
          python -m compileall -q neural
          node --check web/tests/policy-export-parity.mjs
          git diff --check
      - name: Commit only source changes and remove one-time staging
        run: |
          git add --pathspec-from-file=.review/changed.txt
          git rm .review/apply-policy-parity.py .review/finalize-policy-parity.py .github/workflows/parity-review-workspace.yml .github/workflows/apply-policy-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align acting-policy numerics and bound both imagined decision stages'
          git push origin HEAD:refs/heads/fix/policy-search-parity-20260917
