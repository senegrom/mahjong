name: Prepare approved Two Characters Roof Garden C
on:
  push:
    branches: [art/prepare-van-gogh-two-roofs-20261031]
    paths: ['.roof-prep/**', '.github/workflows/prepare-two-roofs-art.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: bf131abc4cccb56d97cf974e2138e5fb66b3731b
      TARGET_BRANCH: art/van-gogh-two-characters-roof-garden-c-20261031
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install selected roofs and flower pots
        run: python3 .roof-prep/prepare.py install
      - name: Install existing locked dependencies
        working-directory: web
        run: npm ci
      - name: Validate tile integration and proportions
        working-directory: web
        run: node --test tests/van-gogh*.test.js tests/tile-faces.test.js tests/tile-proportions.test.js
      - name: Lint changed code
        working-directory: web
        run: npx eslint scripts/export-van-gogh-tiles.mjs src/lib/van-gogh-faces.js tests/tile-faces.test.js tests/van-gogh-two-roofs.test.js --max-warnings 0
      - name: Verify preservation and publish clean artwork branch
        run: python3 .roof-prep/prepare.py publish
