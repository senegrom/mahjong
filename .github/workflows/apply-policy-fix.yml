name: apply verified policy fixes
on:
  push:
    branches: [fix/policy-contracts-20260916]
    paths: [.github/workflows/apply-policy-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/policy-contracts-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/policy-contracts-20260916
          persist-credentials: true
      - name: Verify immutable patch and exact destination set
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          data = b''.join(pathlib.Path(f'.policy-fix-{i}.patch').read_bytes() for i in range(3))
          # Canonicalize the accidental indentation of one transport header;
          # source lines are not modified. The canonical bytes must match.
          data = data.replace(b'\n diff --git ', b'\ndiff --git ')
          assert hashlib.sha256(data).hexdigest() == 'ddb954df2e979d3a9cab82d24f024c0f57d2515a01bc44ca7cfa196298c0a213', 'Patch digest mismatch'
          paths = []
          for line in data.decode().splitlines():
              if not line.startswith('diff --git '):
                  continue
              _, _, a, b = line.split()
              assert a.startswith('a/') and b.startswith('b/') and a[2:] == b[2:]
              p = pathlib.PurePosixPath(a[2:])
              assert '..' not in p.parts
              assert p.parts[0] in ('neural', 'web', 'docs') or str(p) == '.github/workflows/neural.yml'
              paths.append(str(p))
          assert len(paths) == len(set(paths)) == 17
          pathlib.Path('/tmp/policy-fix.patch').write_bytes(data)
          pathlib.Path('/tmp/policy-fix-paths').write_text('\n'.join(paths) + '\n')
          PY
      - name: Refuse concurrent source edits and apply patch
        run: |
          git fetch --no-tags --depth=1 origin 6778666f7f93646f4c7564e3dc6abcaf1088f887
          git diff --exit-code 6778666f7f93646f4c7564e3dc6abcaf1088f887 HEAD -- neural web docs .github/workflows/neural.yml
          git apply --check --unidiff-zero /tmp/policy-fix.patch
          git apply --unidiff-zero /tmp/policy-fix.patch
          python3 -m compileall -q neural
          git diff --check
          python3 - <<'PY'
          import pathlib, re, subprocess
          for block in pathlib.Path('/tmp/policy-fix.patch').read_text().split('diff --git ')[1:]:
              path = block.splitlines()[0].split()[1][2:]
              wanted = re.search(r'^index [0-9a-f]+\.\.([0-9a-f]{40})', block, re.M).group(1)
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == wanted, f'Tested source mismatch: {path}'
          PY
      - name: Commit verified source and remove one-time setup
        run: |
          git add --pathspec-from-file=/tmp/policy-fix-paths
          git rm .policy-fix-0.patch .policy-fix-1.patch .policy-fix-2.patch .github/workflows/policy-review-workspace.yml .github/workflows/apply-policy-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align ordinary and search policy contracts and bound rollout inference'
          git push origin HEAD:refs/heads/fix/policy-contracts-20260916
