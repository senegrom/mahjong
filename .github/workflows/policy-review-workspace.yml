name: policy review workspace
on:
  push:
    branches: [fix/policy-contracts-20260916]
    paths: [.github/workflows/policy-review-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Package locked browser test dependencies
        run: |
          cd web
          npm ci --ignore-scripts
          mkdir -p ../review-workspace
          tar -czf ../review-workspace/node_modules.tar.gz node_modules
          sha256sum package-lock.json > ../review-workspace/package-lock.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: policy-review-node
          path: review-workspace
          retention-days: 1
          if-no-files-found: error
