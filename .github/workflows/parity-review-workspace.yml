name: policy parity review workspace
on:
  push:
    branches: [fix/policy-search-parity-20260917]
    paths: [.github/workflows/parity-review-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Archive exact tracked source
        run: |
          mkdir -p review-workspace/wheels
          git archive HEAD | gzip > review-workspace/source.tar.gz
          git rev-parse HEAD > review-workspace/revision.txt
      - name: Build native and download export test dependencies
        run: |
          python -m pip install 'maturin>=1.7,<2'
          (cd engine/riichi-py && maturin build --release --locked --out ../../review-workspace/wheels)
          (cd engine/libriichi && maturin build --release --locked --out ../../review-workspace/wheels)
          python -m pip download --only-binary=:all: --dest review-workspace/wheels 'onnx>=1.17,<2' 'onnxruntime>=1.22,<2'
      - name: Package locked web test dependencies
        run: |
          npm ci --prefix web
          tar -C web -czf review-workspace/node_modules.tar.gz node_modules
          (cd review-workspace && sha256sum source.tar.gz node_modules.tar.gz wheels/* > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: policy-parity-workspace
          path: review-workspace
          retention-days: 2
          if-no-files-found: error
