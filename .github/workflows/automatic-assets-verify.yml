name: verify automatic game assets
on:
  push:
    branches: [main]
    paths: [.github/workflows/automatic-assets-verify.yml, .automatic-assets/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automatic-assets-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate and apply scoped changes
        shell: python
        run: |
          import hashlib, subprocess
          from pathlib import Path
          patch = Path('.automatic-assets/application.patch').read_text().replace('\n diff --git ', '\ndiff --git ')
          assert hashlib.sha256(patch.encode()).hexdigest() == 'd7bc87f3dc9fbe72db2ebabc136150eae7922425a55085df8ffb9bed0240997d'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, text=True, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, text=True, check=True)
      - name: Build actual browser engine and production site
        run: |
          if ! command -v wasm-pack >/dev/null || [ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
          cd web
          npm ci
          npm run wasm
          npm run lint
          npm run check
          npm run build
      - name: Unit and automatic-download coordinator tests
        working-directory: web
        shell: bash
        run: npm run test:unit 2>&1 | tee /tmp/automatic-unit.txt
      - name: Automatic base assets and optional AI browser checks
        working-directory: web
        shell: bash
        run: npm run test:offline 2>&1 | tee /tmp/automatic-offline.txt
      - name: All existing browser regressions
        working-directory: web
        shell: bash
        run: npm run test:browser 2>&1 | tee /tmp/automatic-browser.txt
      - name: Validate installation icons
        working-directory: web
        run: |
          node scripts/check-icons.mjs
          node scripts/check-icons.mjs --built
      - name: Commit tested application directly to main and remove transfer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          original=$(git rev-parse HEAD)
          git rm .automatic-assets/application.patch .github/workflows/automatic-assets-verify.yml
          git add web/src/App.svelte web/src/lib/offline.js web/scripts/offline-check.mjs web/tests/offline-coordinator.test.js docs/AUTOMATIC_DOWNLOADS.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Always prepare game and tiles automatically; reserve downloads for trained AI'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$original" ]; then
            git diff --quiet "$original" origin/main -- web docs/AUTOMATIC_DOWNLOADS.md .automatic-assets .github/workflows/automatic-assets-verify.yml || { echo 'Concurrent application changes: refusing to overwrite'; exit 1; }
            git rebase origin/main
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          git rev-parse HEAD > /tmp/automatic-commit.txt
      - name: Collect reports
        if: always()
        run: |
          cp /tmp/automatic-*.txt web/test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: automatic-assets-verification
          path: web/test-results
          retention-days: 3
