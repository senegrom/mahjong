name: Export approved Mahjong icons

on:
  push:
    branches: [main]
    paths:
      - web/branding/mahjong-approved.webp
      - web/scripts/export-icons.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mahjong-icon-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image exporter
        run: python -m pip install Pillow==11.3.0
      - name: Export and fully decode the approved icon files
        run: python web/scripts/export-icons.py
      - name: Commit only generated icon assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/favicon.ico web/public/favicon-16x16.png web/public/favicon-32x32.png web/public/apple-touch-icon.png web/public/icons/mahjong-192.png web/public/icons/mahjong-512.png web/public/icons/mahjong-512-maskable.png
          if ! git diff --cached --quiet; then
            git commit -m 'Export approved Mahjong PNG and ICO assets'
            git push origin HEAD:main
          fi
