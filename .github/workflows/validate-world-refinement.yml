name: validate world refinement
on:
  push:
    branches: [fix/review-sampling-20260915]
    paths: [.github/workflows/validate-world-refinement.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-sampling-20260915
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: false
      - name: Apply and format the tested refinements
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo 'd42c46b2f51148ac45ea18575ec8796f9bbb527e1f48c02a9358e40aa1660a60  .review-followup.patch' | sha256sum -c -
          git apply .review-followup.patch
          cargo fmt --all
          python -m compileall -q neural
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .review-followup.patch .github/workflows/validate-world-refinement.yml
          git add engine/riichi-core/src/search/sampling.rs neural docs/SEARCH_REVIEW_REPAIRS.md
          git commit -m 'Refine constrained sampling and require independent evidence for weighted fitting'
          git push origin HEAD:fix/review-sampling-20260915
          git rev-parse HEAD > /tmp/refinement-commit.txt
          git archive --format=tar.gz --output=/tmp/refined-source.tar.gz HEAD engine/riichi-core/src/search/sampling.rs neural docs/SEARCH_REVIEW_REPAIRS.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refined-source
          path: |
            /tmp/refined-source.tar.gz
            /tmp/refinement-commit.txt
          retention-days: 2
      - name: Build updated Python engines
        run: |
          python -m pip install 'maturin>=1.7,<2'
          (cd engine/riichi-py && maturin build --release --locked --out ../../wheels)
          (cd engine/libriichi && maturin build --release --locked --out ../../wheels)
          git rev-parse HEAD > wheels/source-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refined-wheels
          path: wheels/
          retention-days: 2
      - name: Native lint and regression tests
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --release
        timeout-minutes: 8
