name: review workspace
on:
  push:
    branches: [fix/review-20260917]
    paths: [.github/workflows/review-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Archive exact source and locked web dependencies
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          npm ci --prefix web
          tar -czf "$RUNNER_TEMP/web-dependencies.tar.gz" web/node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repair-workspace
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/web-dependencies.tar.gz
          compression-level: 0
          retention-days: 1
