name: review workspace
on:
  push:
    branches: [fix/review-six-20260913]
permissions:
  contents: read
jobs:
  workspace:
    if: github.ref == 'refs/heads/fix/review-six-20260913'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-six-20260913
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: false
      - name: Apply exact reviewed edits
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          planned = []
          manifests = sorted(Path('.review-edits').glob('*.json'))
          assert len(manifests) == 9
          for manifest in manifests:
              for item in json.loads(manifest.read_text()):
                  path = Path(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  old = path.read_bytes() if path.exists() else b''
                  assert hashlib.sha256(old).hexdigest() == item['before'], str(path)
                  lines = old.decode().splitlines(keepends=True)
                  for start, end, text in reversed(item['edits']):
                      lines[start:end] = text.splitlines(keepends=True)
                  new = ''.join(lines).encode()
                  assert hashlib.sha256(new).hexdigest() == item['after'], str(path)
                  planned.append((path, new))
          for path, data in planned:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY
          cargo fmt --all
          python -m compileall -q neural
          node --test web/tests/legacy-pass-migration.test.js web/tests/session.test.js
          git diff --check
      - name: Commit formatted repairs to validation branch
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .review-edits .github/workflows/review-workspace.yml
          git add docs/SEARCH_REVIEW_REPAIRS.md engine/riichi-core/src/search.rs engine/riichi-py/src/lib.rs neural web/src/lib/session.js web/tests/legacy-pass-migration.test.js
          git commit -m 'Fix search reward accounting, atomic actions, bounded leaves and recording publication'
          git push origin HEAD:fix/review-six-20260913
          git archive --format=tar.gz --output=/tmp/repaired-source.tar.gz HEAD engine/riichi-core/src/search.rs engine/riichi-py/src/lib.rs neural web/src/lib/session.js web/tests/legacy-pass-migration.test.js docs/SEARCH_REVIEW_REPAIRS.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.commit.outcome == 'success'
        with:
          name: repaired-source
          path: /tmp/repaired-source.tar.gz
          retention-days: 1
      - name: Rust lint
        if: steps.commit.outcome == 'success'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust regression tests
        if: steps.commit.outcome == 'success'
        run: cargo test --locked --workspace
      - name: Build updated Python test wheels
        if: steps.commit.outcome == 'success'
        run: |
          python -m pip install 'maturin>=1.7,<2'
          (cd engine/riichi-py && maturin build --release --locked --out /tmp/review-wheels)
          (cd engine/libriichi && maturin build --release --locked --out /tmp/review-wheels)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.commit.outcome == 'success'
        with:
          name: repaired-wheels
          path: /tmp/review-wheels
          if-no-files-found: error
          retention-days: 1
