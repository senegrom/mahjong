name: review workspace
on:
  push:
    branches: [fix/review-six-20260913]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            engine/libriichi -> target
          save-if: false
      - name: Package source
        run: git archive --format=tar.gz --output=/tmp/mahjong-source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-source
          path: /tmp/mahjong-source.tar.gz
          retention-days: 1
      - name: Build local test wheels
        run: |
          python -m pip install 'maturin>=1.7,<2'
          (cd engine/riichi-py && maturin build --release --locked --out /tmp/review-wheels)
          (cd engine/libriichi && maturin build --release --locked --out /tmp/review-wheels)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-wheels
          path: /tmp/review-wheels
          retention-days: 1
