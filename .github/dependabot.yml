version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    # These peer dependencies must move together, including major upgrades.
    groups:
      svelte-vite:
        applies-to: version-updates
        patterns:
          - svelte
          - vite
          - '@sveltejs/vite-plugin-svelte'
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
