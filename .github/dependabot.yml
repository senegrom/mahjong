version: 2
updates:
  - package-ecosystem: cargo
    # libriichi is excluded from the root workspace and has its own lockfile.
    # Scan both so related Python-binding updates can share one reviewed PR.
    directories:
      - /
      - /engine/libriichi
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-bindings:
        applies-to: version-updates
        patterns: ['pyo3*', numpy, ndarray]
      rand-family:
        applies-to: version-updates
        patterns: [rand, 'rand_*']
      # Cargo 0.x minor updates can be breaking; keep unrelated ones separate.
      rust-patches:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
  - package-ecosystem: npm
    directory: /web
    # svelte-check accepts TypeScript ^5 || ^6 and nothing newer; a major
    # beyond that cannot install until svelte-check widens its peer range.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # These peer dependencies must move together, including major upgrades.
    groups:
      svelte-vite:
        applies-to: version-updates
        patterns:
          - svelte
          - vite
          - '@sveltejs/vite-plugin-svelte'
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        # onnxruntime-web must be the release web/runtime was built from, which
        # copy-runtime.mjs checks, so it gets a pull request of its own that
        # fails until the runtime is rebuilt at that release: dispatch the
        # reduced ONNX runtime workflow with it, merge that branch, and close
        # this one. Kept out of the group so it never holds other updates back.
        exclude-patterns: [onnxruntime-web]
        update-types: [minor, patch]
    schedule:
      interval: weekly
      day: monday
    # Room for an onnxruntime-web pull request waiting on its rebuild.
    open-pull-requests-limit: 6
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: pip
    # The exact CPU export and training tools CI installs: the browser worker
    # parity job, which every Pages deploy needs, and the trainer's tests.
    directory: /.github/actions/python-engines
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-engine-tools:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    # The runtime rebuild's tools (onnx, flatbuffers, ...). Their pull requests
    # get an install and dependency check; the next rebuild runs them for real.
    directory: /web/runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      runtime-tools-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
